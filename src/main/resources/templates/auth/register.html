<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registrarse')}"></head>
<body>
<main class="app-main">
    <div class="card" style="padding:1.5rem">
        <h1 style="color:var(--color-primary)">Crear cuenta</h1>
        <div th:if="${error}" style="color:var(--color-primary)" th:text="${error}">Error</div>
        <form th:action="@{/register}" th:object="${registerRequest}" method="post">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
            <label>Usuario
                <input type="text" th:field="*{username}" required>
            </label>
            <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Error</p>
            <label>Email
                <input type="email" th:field="*{email}" required>
            </label>
            <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Error</p>
            <label>Contraseña (mínimo 8 caracteres)
                <input type="password" th:field="*{password}" required>
            </label>
            <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Error</p>
            <label>Fecha de nacimiento (debes tener 18 años o más)
                <input type="date" th:field="*{birthDate}" required>
            </label>
            <p th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}">Error</p>
            <button type="submit" class="btn-primary">Registrarme</button>
        </form>
        <p>¿Ya tenés cuenta? <a th:href="@{/login}">Iniciá sesión</a></p>
    </div>
</main>
</body>
</html>
