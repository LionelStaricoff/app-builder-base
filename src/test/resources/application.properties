# Tests: H2 en memoria. OJO: este archivo NO se mergea con el de main,
# lo SHADOWEA por completo (misma location classpath:/, gana test-classes).
# Por eso tiene que ser self-contained: todo @Value que el contexto necesite
# (escrow.*, refund.tiers, multipart) va repetido aca con literales.
# Literales a proposito: los tests tienen que ser deterministicos, sin depender
# del .env ni de variables de entorno.
spring.datasource.url=jdbc:h2:mem:sharedtest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

# El esquema de los tests lo crea FLYWAY (las mismas migraciones que en dev/prod)
# y Hibernate solo lo VALIDA (ddl-auto=validate). Así el schema del H2 es
# exactamente el del Postgres: si una entidad y una migración divergen, los
# tests lo detectan, en vez de que Hibernate lo tape con create-drop.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

spring.multipart.max-file-size=5MB
spring.multipart.max-request-size=25MB

escrow.commission-rate=0.05

# Secret del webhook para tests (antes estaba como @SpringBootTest(properties=...)
# en StripeWebhookControllerTests, lo que creaba un contexto Spring separado con
# otro FakePaymentGateway y colisionaba de session ids contra la H2 compartida).
stripe.webhook-secret=whsec_test

# Didit para tests: secret de firma del webhook (el signer de tests usa lo
# mismo) y workflow/callback cualquiera — el cliente de sesiones se reemplaza
# por un fake en TestDiditConfig, nunca se llama a la red.
didit.api-key=test-key
didit.webhook-secret=whsec_test
didit.workflow-id=wf-test
didit.base-url=https://verification.didit.me
didit.callback-url=http://localhost/verificacion/callback
escrow.auto-release-days=2
refund.tiers=24:0.90,0:0.50

# Propuesta de experiencia con IA (spec 2026-10-26-ai-proposal-design.md §4.4).
# Con model.chat=none los TRES starters quedan apagados: el contexto arranca
# sin key (la degradación del spec, en su forma más dura) y el bean que usa la
# app es el stub, porque ai.proposal.provider=stub lo fuerza. Literales, como
# todo lo demas de este archivo.
spring.ai.model.chat=none
ai.proposal.provider=stub
# Demas tipos de modelo tambien en none: los autoconfigs los encenderian por
# defecto (matchIfMissing) y sus clientes validan key al arrancar.
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.embedding=none
spring.ai.model.embedding.text=none
spring.ai.model.image=none
spring.ai.model.moderation=none

# Password de los usuarios demo que crea DataSeeder. Acá va literal (no por
# env): los tests tienen que ser deterministicos, igual que en main.
app.demo.password=Clave1234!
# Los datos precargados se siembran en tests (el datasource es H2).
app.demo.enabled=true
