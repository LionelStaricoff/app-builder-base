<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Confirmación')}"></head>
<body>
<main class="app-main">
    <div class="card" style="padding:1.5rem;background:var(--surface)">
        <div th:if="${reservation == null}" style="padding:1rem">
            <h2>Todavía no tenés reservas</h2>
            <a class="btn-primary" th:href="@{/feed}" style="background:#fff;color:#E91E63">Ver experiencias</a>
        </div>
        <div th:if="${reservation != null}">
            <p style="font-size:2rem;margin:.5rem 0" th:text="(${esCreador} ? 'COBRASTE ' : 'PAGASTE ') + ${currencyCode} + ' ' + ${monto}">PAGASTE MXN 0</p>
            <p th:text="${reservation.instance.experience.name}">Experiencia</p><p class="meta" th:text="'Para ' + ${reservation.attendees} + ' cupo(s) · llega a tu cuenta ' + ${currencyCode} + ' ' + ${payout} + ' menos 5% de comisión'">Detalle</p>
            <a class="btn-primary" th:href="@{/reservations}">Mis reservas</a>
        </div>
    </div>
</main>
<nav th:replace="~{fragments/layout :: nav('feed')}"></nav>
</body>
</html>
