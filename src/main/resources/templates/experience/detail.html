<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${experience.name})}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
<main class="app-main">
    <div class="card">
        <div class="gallery">
            <img th:each="img : ${images}" th:src="'data:image/png;base64,' + ${img.data}"
                 th:alt="${experience.name}" style="width:100%;display:block">
        </div>
        <div style="padding:1rem">
            <h1 th:text="${experience.name}">Nombre</h1>
            <p class="meta">
                <span class="stars">★</span>
                <span th:text="${#numbers.formatDecimal(experience.ratingAverage, 1, 1)}">0.0</span>
                · <span th:text="${experience.category}">Categoria</span>
                · <span th:text="${experience.durationMinutes} + ' min'">60 min</span>
                · <strong th:text="'$' + ${experience.price} + ' MXN'">$190 MXN</strong>
            </p>
            <p th:text="${experience.description}">Descripción</p>
            <p>
                <strong>Cupos:</strong>
                <span th:text="${experience.minCapacity} + ' a ' + ${experience.maxCapacity}">2 a 8</span>
            </p>

            <div id="detail-map" data-map="view"
                 th:attr="data-lat=${experience.meetingLat},data-lng=${experience.meetingLng}"
                 style="height:220px;border-radius:16px"></div>
            <p class="hint">Punto de encuentro: <span th:text="${experience.meetingLat} + ', ' + ${experience.meetingLng}">0, 0</span></p>

            <h3>Próximas fechas</h3>
            <div th:if="${#lists.isEmpty(instances)}" class="empty">No hay fechas disponibles</div>
            <div class="card slot" th:each="inst : ${instances}">
                <p>
                    <strong th:text="${#temporals.format(inst.date, 'dd/MM/yyyy')} + ' — ' + ${#temporals.format(inst.startTime, 'HH:mm')}">01/11/2026 — 10:00</strong>
                </p>
                <div th:replace="~{experience/picker-modal :: picker(${inst.id})}"></div>
                <form th:if="${esDueno}"
                      th:action="@{/instances/{id}/cancel(id=${inst.id})}" method="post"
                      onsubmit="return confirm('¿Cancelar esta fecha? Se reembolsa el 100% a los inscritos.');">
                    <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                    <button type="submit" class="btn-secondary">Cancelar fecha</button>
                </form>
            </div>
        </div>
    </div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script th:src="@{/js/map.js}"></script>
</body>
</html>
