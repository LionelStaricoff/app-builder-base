<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mis reservas')}"></head>
<body>
<main class="app-main">
    <div class="empty" th:if="${ok}" th:text="${ok}">OK</div>
    <div class="empty" th:if="${error}" th:text="${error}">Error</div>

    <section th:if="${!#lists.isEmpty(pendientes)}">
        <h3>Esperando tu confirmación</h3>
        <div class="card" th:each="r : ${pendientes}" style="padding:1rem">
            <p>
                <strong th:text="${r.instance.experience.name}">Experiencia</strong>
                · <span th:text="${r.user.username}">usuario</span>
                · <span th:text="${r.attendees}">1</span> cupo(s)
                · <span th:text="${r.instance.date}">01/11/2026</span>
            </p>
            <form th:action="@{/reservations/{id}/confirm(id=${r.id})}" method="post">
                <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                <button type="submit" class="btn-primary">Confirmar</button>
            </form>
        </div>
    </section>

    <h3>Mis reservas</h3>
    <div class="empty" th:if="${#lists.isEmpty(reservations)}">Todavía no reservaste nada.</div>

    <div class="card" th:each="r : ${reservations}" style="padding:1rem">
        <p>
            <strong th:text="${r.instance.experience.name}">Experiencia</strong>
            · <span th:text="${r.instance.date}">01/11/2026</span>
            · <span th:text="${r.attendees}">1</span> cupo(s)
            · <span th:text="${r.status}">PENDIENTE</span>
        </p>

        <form th:if="${r.status.name() != 'CANCELADO'}"
              th:action="@{/reservations/{id}/cancel(id=${r.id})}" method="post">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
            <button type="submit" class="btn-secondary">Cancelar reserva</button>
        </form>

        <form th:if="${r.status.name() == 'CONFIRMADA'}"
              th:action="@{/instances/{id}/rate(id=${r.instance.id})}" method="post"
              style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
            <label class="hint">Estrellas
                <select name="stars">
                    <option th:each="s : ${#numbers.sequence(1,5)}" th:value="${s}" th:text="${s}">5</option>
                </select>
            </label>
            <label class="hint" style="flex:1;min-width:12rem">Comentario
                <input name="text" placeholder="¿Qué tal estuvo?">
            </label>
            <button type="submit" class="btn-primary">Evaluar</button>
        </form>
    </div>
</main>
</body>
</html>
