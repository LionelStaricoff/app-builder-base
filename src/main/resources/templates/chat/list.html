<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mensajes')}"></head>
<body>
<main class="app-main">
    <p class="meta">
        <a th:href="@{/notifications}">Notificaciones</a> · <strong>Mensajes</strong>
    </p>

    <div class="empty" th:if="${#lists.isEmpty(grupos)}">Todavía no tenés chats.</div>

    <a class="card" th:each="g : ${grupos}" th:href="@{/chats/{id}(id=${g.id})}"
       style="display:block;padding:1rem;text-decoration:none;color:inherit">
        <strong th:text="${g.experience.name}">Experiencia</strong>
        <p class="meta">
            📅 <span th:text="${g.date}">01/11/2026</span>
            <span th:if="${g.archived}" class="chip">Archivado</span>
        </p>
    </a>
</main>
</body>
</html>
