spring.application.name=share

spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update


# HikariCP contra Postgres remoto: los defaults (maxLifetime 30 min, sin
# keepalive) dejan conexiones muertas en el pool cuando el servidor, la nube
# o un NAT/firewall cortan el TCP idle. Resultado: rÃ¡fagas de
# "Failed to validate connection ... closed" y requests que cuelgan o fallan
# al toparse con el pool muerto (ej. el POST /location).
# maxLifetime (3 min) va POR DEBAJO del idle-timeout tÃ­pico de la nube/NAT y
# el keepalive (30 s) mantiene vivas las idle y el mapeo NAT.
# Entorno: HIKARI_MAX_LIFETIME / HIKARI_KEEPALIVE_TIME /
# HIKARI_CONNECTION_TIMEOUT / HIKARI_VALIDATION_TIMEOUT
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:180000}
spring.datasource.hikari.keepalive-time=${HIKARI_KEEPALIVE_TIME:30000}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:10000}
spring.datasource.hikari.validation-timeout=${HIKARI_VALIDATION_TIMEOUT:3000}


# Subida de imÃ¡genes: el default de Spring Boot es 1 MB por archivo, cualquier
# foto real (iPhone/Mac) lo supera y el POST falla con MaxUploadSizeExceeded.
# Entorno: SPRING_MULTIPART_MAX_FILE_SIZE / SPRING_MULTIPART_MAX_REQUEST_SIZE
spring.multipart.max-file-size=${SPRING_MULTIPART_MAX_FILE_SIZE:5MB}
spring.multipart.max-request-size=${SPRING_MULTIPART_MAX_REQUEST_SIZE:25MB}

