<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/*
  Card de experiencia: UNICA fuente de verdad para el feed y para cualquier
  lista que muestre experiencias (favoritos, y las que vengan).

  Por que un fragmento: esta card estaba escrita DOS veces (aqui y en
  feed-infinite.js). Cada campo nuevo -includes/bring fue el ultimo- habia
  que agregarlo en los dos lugares, y el que se olvidaba dejaba la UI
  desincronizada sin ningun error visible.

  El corazon de favoritos ya resuelve los dos estados: si dto.favorite es
  true el POST va a /favorites/{id}/remove, si no a /add. Por eso el mismo
  fragmento sirve en las dos pantallas sin parametro de modo.
*/-->
        <div th:fragment="card(dto)" th:if="${dto != null}" th:id="'card-' + ${dto.id}" class="card feed-card w-full bg-white rounded-3xl shadow-xl border border-gray-100 overflow-hidden font-sans transition-transform duration-300 hover:scale-[1.02]" style="border: 1px solid var(--border-subtle)">
          
          <div class="relative w-full overflow-hidden group feed-card-cover">
            <img th:if="${(dto.images == null or #lists.isEmpty(dto.images)) and dto.coverBase64 != null}"
                 th:src="'data:image/jpeg;base64,' + ${dto.coverBase64}" 
                 alt="Experiencia" 
                 class="w-full h-full object-cover">
            
            <div class="absolute inset-x-0 top-0 h-24 bg-gradient-to-b from-black/50 to-transparent pointer-events-none z-10"></div>

            <div class="absolute top-4 right-4 flex items-center gap-2 z-20">
              <button class="bg-white/90 hover:bg-white text-gray-800 p-2.5 rounded-full backdrop-blur-md shadow-md transition-all active:scale-95 flex items-center justify-center" th:attr="data-share-experience=${dto.id}">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
              </button>
              <form th:action="${dto.favorite} ? @{/favorites/{id}/remove(id=${dto.id})} : @{/favorites/{id}/add(id=${dto.id})}" method="post" class="inline">
                <button type="submit" class="bg-white/90 hover:bg-white text-gray-800 p-2.5 rounded-full backdrop-blur-md shadow-md transition-all active:scale-95 flex items-center justify-center">
                  <svg class="w-4 h-4" th:classappend="${dto.favorite} ? 'fill-rose-500 stroke-rose-500' : ''" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
                </button>
              </form>
            </div>

            <div class="absolute bottom-4 left-4 bg-white/95 backdrop-blur-md px-3 py-1.5 rounded-2xl shadow-lg flex items-center gap-2 z-20 border border-white/40">
              <span class="text-amber-500 text-base">★</span>
              <div class="flex flex-col leading-none">
                <span class="text-xs font-bold text-gray-900" th:text="${dto.ratingAverage > 0 ? #numbers.formatDecimal(dto.ratingAverage, 1, 1) : '0.0'}">0.0</span>
                <span class="text-[10px] text-gray-500 font-medium" th:text="${dto.ratingAverage > 0 ? 'Reseñas' : 'Nuevo'}">Nuevo</span>
              </div>
            </div>

            <div class="absolute inset-0 z-10" data-carousel th:if="${dto.images != null and not #lists.isEmpty(dto.images)}">
                <div class="relative h-full w-full overflow-hidden" data-carousel-track>
                    <div class="flex h-full transition-transform duration-300 ease-out">
                        <img th:each="imgData : ${dto.images}" th:src="'data:image/jpeg;base64,' + ${imgData}" 
                             class="flex-shrink-0 w-full h-full object-cover" th:alt="${dto.name}">
                    </div>
                </div>
                <div class="absolute bottom-4 right-4 bg-black/50 backdrop-blur-md text-white text-xs font-medium px-3.5 py-1.5 rounded-full flex items-center gap-3 shadow-lg border border-white/20 z-20">
                  <button type="button" data-carousel-prev class="hover:text-amber-400 transition-colors font-bold text-sm">‹</button>
                  <span class="tracking-widest" data-carousel-counter>1 / 5</span>
                  <button type="button" data-carousel-next class="hover:text-amber-400 transition-colors font-bold text-sm">›</button>
                </div>
            </div>
          </div>

          <div class="space-y-4 feed-card-body">
            <div class="flex items-start justify-between gap-2">
              <div class="max-w-[70%]">
                <h2 class="font-black text-gray-900 tracking-tight flex items-center gap-2 feed-card-title" th:text="${dto.name}">Nombre</h2>
              </div>
            </div>

            <div class="inline-flex items-center gap-2 bg-gray-100/80 px-3 py-1.5 rounded-full text-xs text-gray-700 font-medium" th:if="${dto.creatorName != null}">
              <div class="w-5 h-5 rounded-full bg-gray-900 text-white flex items-center justify-center text-[10px] font-bold overflow-hidden">
                <img th:if="${dto.creatorAvatar != null and !#strings.isEmpty(dto.creatorAvatar)}"
                     th:src="'data:image/jpeg;base64,' + ${dto.creatorAvatar}" alt="" class="w-full h-full object-cover">
                <span th:if="${dto.creatorAvatar == null or #strings.isEmpty(dto.creatorAvatar)}"
                      th:text="${#strings.substring(dto.creatorName, 0, 1)}">L</span>
              </div>
              <span>Organizado por <strong class="text-gray-900" th:text="${dto.creatorName}">Lionel</strong></span>
            </div>

            <div class="grid grid-cols-3 gap-2 py-3 text-center text-xs text-gray-600 border-y border-gray-100">
              <div class="flex flex-col items-center gap-1.5">
                <svg class="w-5 h-5 text-gray-700" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                <span class="font-bold text-gray-900" th:text="${dto.nextDate != null ? T(com.openlab.mx.share.shared.ui.UiLabels).fechaCorta(dto.nextDate) : 'Sin fecha'}">24 oct</span>
              </div>
              <div class="flex flex-col items-center gap-1.5 border-x border-gray-100 px-2">
                <svg class="w-5 h-5 text-gray-700" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span class="font-bold text-gray-900" th:text="${dto.durationMinutes >= 60 ? T(java.lang.Math).floorDiv(dto.durationMinutes, 60) + ' h' + (T(java.lang.Math).floorMod(dto.durationMinutes, 60) > 0 ? ' ' + T(java.lang.Math).floorMod(dto.durationMinutes, 60) + ' min' : '') : dto.durationMinutes + ' min'}">5 horas</span>
              </div>
              <div class="flex flex-col items-center gap-1.5 min-w-0">
                <a th:with="firstStop=${dto.stops != null and !#lists.isEmpty(dto.stops) ? dto.stops[0] : null}" 
                   th:href="${firstStop != null} ? 'https://www.google.com/maps/search/?api=1&query=' + ${firstStop.lat} + ',' + ${firstStop.lng} : 'https://www.google.com/maps/search/?api=1&query=' + ${dto.meetingPointLabel}" 
                   target="_blank" class="flex flex-col items-center gap-1.5 w-full min-w-0 hover:text-teal-600 transition-colors group">
                  <svg class="w-5 h-5 text-gray-700 group-hover:text-teal-600" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                  <span class="font-bold text-gray-900 truncate w-full group-hover:text-teal-600" th:text="${dto.meetingPointLabel}">Recorrido</span>
                </a>
              </div>
            </div>

            <!--/* SECCIÓN DE PARADAS: <details> nativo. Da teclado (Enter/Space),
                 estado expandido al lector de pantalla y funciona igual en las
                 tarjetas que inyecta el scroll infinito, sin JS duplicado. */-->
            <details th:if="${dto.stops != null and !#lists.isEmpty(dto.stops)}" class="feed-details border-b border-gray-100 pb-2">
              <summary class="w-full flex items-center justify-between py-2.5 text-[10px] font-bold text-gray-400 uppercase tracking-wider hover:text-gray-600 transition-colors cursor-pointer">
                <span class="flex items-center gap-2">
                  <svg aria-hidden="true" class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.89M15 20l5.447-2.89M12 20V4"/></svg>
                  Ver Recorrido
                </span>
                <svg aria-hidden="true" class="feed-details-chevron w-3 h-3 transition-transform" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
              </summary>
              <div class="space-y-2 py-2 px-1">
                <div th:each="stop, iterStat : ${dto.stops}" class="flex items-start gap-3">
                  <div class="flex flex-col items-center">
                    <div class="w-2 h-2 rounded-full bg-teal-600 mt-1" th:classappend="${iterStat.first} ? 'ring-4 ring-teal-100' : ''"></div>
                    <div th:if="${!iterStat.last}" class="w-px h-4 bg-gray-200"></div>
                  </div>
                  <div class="flex flex-col">
                    <span class="text-[11px] font-bold text-gray-800" th:text="${stop.placeName}">Parada</span>
                    <span class="text-[9px] text-gray-500" th:text="${stop.city + ', ' + stop.country}">Ciudad, Pais</span>
                  </div>
                </div>
              </div>
            </details>

            <!--/* Contenido estructurado (spec §7): mismo <details> nativo que el
                 recorrido. Si el campo viene vacío no se renderiza nada. */-->
            <details th:if="${dto.includes != null and !#strings.isEmpty(dto.includes)}"
                     class="feed-details border-b border-gray-100 pb-2">
              <summary class="w-full flex items-center justify-between py-2.5 text-[10px] font-bold text-gray-400 uppercase tracking-wider hover:text-gray-600 transition-colors cursor-pointer">
                <span class="flex items-center gap-2">
                  <svg aria-hidden="true" class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                  Qué incluye
                </span>
                <svg aria-hidden="true" class="feed-details-chevron w-3 h-3 transition-transform" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
              </summary>
              <p class="whitespace-pre-line text-[11px] text-gray-600 leading-relaxed py-2 px-1"
                 th:text="${dto.includes}">Entrada al museo</p>
            </details>

            <details th:if="${dto.bring != null and !#strings.isEmpty(dto.bring)}"
                     class="feed-details border-b border-gray-100 pb-2">
              <summary class="w-full flex items-center justify-between py-2.5 text-[10px] font-bold text-gray-400 uppercase tracking-wider hover:text-gray-600 transition-colors cursor-pointer">
                <span class="flex items-center gap-2">
                  <svg aria-hidden="true" class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
                  Qué llevar
                </span>
                <svg aria-hidden="true" class="feed-details-chevron w-3 h-3 transition-transform" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
              </summary>
              <p class="whitespace-pre-line text-[11px] text-gray-600 leading-relaxed py-2 px-1"
                 th:text="${dto.bring}">Calzado cómodo</p>
            </details>

            <div class="grid grid-cols-5 gap-3">
              <div class="col-span-3 bg-gray-50 p-4 rounded-2xl border border-gray-100 flex flex-col justify-between space-y-3">
                <div class="flex justify-between items-center gap-2 text-xs">
                  <span class="font-semibold text-gray-800 whitespace-nowrap">Lugares libres</span>
                  <span class="text-gray-400 font-medium text-[11px] whitespace-nowrap" th:text="${dto.maxCapacity != null ? dto.maxCapacity + ' cupos' : '0 cupos'}">10 cupos</span>
                </div>
                <div class="w-full bg-gray-200 h-2 rounded-full overflow-hidden">
                  <div class="bg-teal-700 h-full rounded-full transition-all duration-300" th:style="'width:' + ${dto.maxCapacity != null and dto.maxCapacity > 0 ? T(java.lang.Math).round(dto.reservedCount * 100.0 / dto.maxCapacity) : 0} + '%'"></div>
                </div>
                <div class="flex items-center justify-between text-[11px] text-gray-500">
                  <div class="flex items-center gap-1.5">
                    <div class="flex -space-x-1.5">
                      <img th:each="av : ${dto.reservedAvatars}" class="w-4 h-4 rounded-full ring-1 ring-white object-cover" th:src="'data:image/jpeg;base64,' + ${av}" alt="">
                    </div>
                    <span th:text="${dto.reservedCount} + ' reservaron'">2 reservaron</span>
                  </div>
                  <span class="font-bold text-teal-700" th:text="${dto.availableCapacity != null ? dto.availableCapacity + ' libres' : '0 libres'}">6 libres</span>
                </div>
              </div>
              <div class="col-span-2 bg-gray-50 px-2 py-4 rounded-2xl border border-gray-100 flex flex-col items-center justify-center text-center">
                <span class="text-[9px] font-extrabold uppercase tracking-wider text-gray-400 whitespace-nowrap">Precio total</span>
                <span class="mt-1 text-[9px] font-bold uppercase tracking-widest text-gray-400 leading-none"
                      th:text="${dto.currencyCode}">COP</span>
                <span class="mt-1 text-gray-900 font-black text-[13px] leading-tight tracking-tight whitespace-nowrap"
                      th:text="${#numbers.formatDecimal(dto.price, 1, 'COMMA', 2, 'POINT')}">190.00</span>
              </div>
            </div>
            
            <a class="w-full bg-gray-100 hover:bg-gray-200 active:scale-[0.99] text-gray-900 font-bold py-3.5 px-5 rounded-2xl flex items-center justify-between border border-gray-200 transition-all shadow-sm" th:href="@{/experiences/{id}(id=${dto.id})}">
              <span class="mx-auto text-sm">Reservar ahora</span>
              <div class="flex items-center gap-1.5 opacity-60">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a2 2 0 002-2V7a2 2 0 00-2-2H6a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
              </div>
            </a>
          </div>
        </div>
<!--/* Lista completa: UNICA definicion de "como se pinta N cards". La usan el
     render inicial de /feed y el endpoint /feed/cards que alimenta el scroll
     infinito, asi que el markup existe una sola vez en todo el proyecto. */-->
<th:block th:fragment="cards(page)">
  <th:block th:each="dto : ${page.content}">
    <div th:replace="~{fragments/feed-card :: card(${dto})}"></div>
  </th:block>
</th:block>
</body>
</html>
