<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#E91E63">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Shared">
    <link rel="apple-touch-icon" th:href="@{/icons/icon-192.png}">
    <title th:text="${title} ?: 'Shared'">Shared</title>
    <link rel="manifest" th:href="@{/manifest.webmanifest}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Bricolage+Grotesque:wght@500;600;700;800&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!--/* v=2: subir al tocar app.css para que el navegador no sirva el viejo cacheado */-->
    <link rel="stylesheet" th:href="@{/css/app.css(v=26)}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'sans-serif'] },
            colors: { brand: { 50: '#fff1f2', 100: '#ffe4e6', 500: '#e11d48', 600: '#e11d48', 700: '#be123c', dark: '#881337' } },
            keyframes: {
              fadeInStagger: { '0%': { opacity: '0', transform: 'translateY(8px) scale(0.94)' }, '100%': { opacity: '1', transform: 'translateY(0) scale(1)' } },
              pulseGlow: { '0%, 100%': { opacity: '0.3' }, '50%': { opacity: '0.6' } }
            },
            animation: { stagger: 'fadeInStagger 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards', pulseGlow: 'pulseGlow 3s infinite ease-in-out' }
          }
        }
      }
    </script>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      .stagger-1 { animation-delay: 0.04s; } .stagger-2 { animation-delay: 0.08s; } .stagger-3 { animation-delay: 0.12s; }
      .stagger-4 { animation-delay: 0.16s; } .stagger-5 { animation-delay: 0.20s; } .stagger-6 { animation-delay: 0.24s; }
      .stagger-7 { animation-delay: 0.28s; } .stagger-8 { animation-delay: 0.32s; }
    </style>
    <script>
      /* Theme — ÚNICA fuente de verdad del estilo visual */
      (function () {
        var KEY = 'visualStyle';
        var PREV_KEY = 'visualStylePrev';
        function read(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
        function write(key, val) { try { localStorage.setItem(key, val); } catch (e) { /* storage no disponible */ } }
        function markActive(s) {
          var buttons = document.querySelectorAll('[data-visual-style]');
          buttons.forEach(function (btn) {
            var on = btn.dataset.visualStyle === s;
            btn.classList.toggle('active', on);
            // aria-pressed: los botones son un grupo de opciones con estado, y sin
            // esto el lector de pantalla anuncia seis botones sin decir cuál está activo.
            btn.setAttribute('aria-pressed', on ? 'true' : 'false');
          });
        }
        function current() { return read(KEY) || '1'; }
        function set(styleNum) {
          var s = String(styleNum);
          if (s !== '1' && s !== '2' && s !== '3' && s !== '4' && s !== '5' && s !== '6') { s = '1'; }
          document.documentElement.dataset.style = s;
          write(KEY, s);
          markActive(s);
        }
        function toggleDark() {
          var cur = current();
          if (cur === '3') {
            var prev = read(PREV_KEY) || '1';
            set(prev === '3' ? '1' : prev);
          } else {
            write(PREV_KEY, cur);
            set('3');
          }
        }
        window.Theme = { get: current, set: set, toggleDark: toggleDark, isDark: function () { return current() === '3'; } };
        window.setStyle = set;
        var vs = read(KEY);
        if (!vs) {
          var legacyDark = null;
          try { legacyDark = localStorage.getItem('darkMode'); } catch (e) { /* nada */ }
          vs = (legacyDark === 'true' || legacyDark === true) ? '3' : '1';
          write(KEY, vs);
        }
        document.documentElement.dataset.style = vs;
      })();
    </script>
    <script th:src="@{/js/sw-register.js}" defer></script>
    <script th:src="@{/js/loader.js}" defer></script>
    <script th:src="@{/js/share-sheet.js}" defer></script>
</head>
<body>
<nav th:fragment="nav(active)" class="bottom-nav" aria-label="Navegación principal">
    <div class="nav-brand">
        <img th:src="@{/img/logo.svg}" alt="" class="nav-brand-logo">
        <span class="nav-brand-name">Shared</span>
    </div>
    <ul class="bottom-nav-list">
        <li>
            <a th:href="@{/feed}" th:classappend="${active == 'feed'} ? 'active'"
               th:attr="aria-current=${active == 'feed'} ? 'page' : null">
                <span class="nav-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" focusable="false">
                        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <path d="M9 22V12h6v10"/>
                    </svg>
                </span>
                <span class="nav-label">Feed</span>
            </a>
        </li>
        <li>
            <a th:href="@{/favorites}" th:classappend="${active == 'favorites'} ? 'active'"
               th:attr="aria-current=${active == 'favorites'} ? 'page' : null">
                <span class="nav-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" focusable="false">
                        <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/>
                    </svg>
                </span>
                <span class="nav-label">Favoritos</span>
            </a>
        </li>
        <li>
            <a th:href="@{/my-experiences}" th:classappend="${active == 'mine'} ? 'active'"
               th:attr="aria-current=${active == 'mine'} ? 'page' : null">
                <span class="nav-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" focusable="false">
                        <path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3z"/>
                        <path d="M9 3v15"/>
                        <path d="M15 6v15"/>
                    </svg>
                </span>
                <span class="nav-label">Experiencias</span>
            </a>
        </li>
        <li>
            <a th:href="@{/notifications}" th:classappend="${active == 'notifications'} ? 'active'"
               th:attr="aria-current=${active == 'notifications'} ? 'page' : null,
                        aria-label=${unreadNotifications != null and unreadNotifications > 0
                            ? unreadNotifications + (unreadNotifications == 1L ? ' aviso sin leer' : ' avisos sin leer')
                            : null}">
                <span class="nav-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" focusable="false">
                        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
                        <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
                    </svg>
                    <span class="nav-badge"
                          th:if="${unreadNotifications != null and unreadNotifications > 0}"
                          th:text="${unreadNotifications > 99 ? '99+' : unreadNotifications}">3</span>
                </span>
                <span class="nav-label">Avisos</span>
            </a>
        </li>
        <li>
            <a th:href="@{/settings}"
               th:classappend="${active == 'settings' or active == 'chats' or active == 'payouts'} ? 'active'"
               th:attr="aria-current=${active == 'settings' or active == 'chats' or active == 'payouts'} ? 'page' : null">
                <span class="nav-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" focusable="false">
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </span>
                <span class="nav-label">Perfil</span>
            </a>
        </li>
    </ul>
</nav>
</body>
</html>
