<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body>
<div class="auth-screen">
    <div class="auth-brand">
        <img th:src="@{/img/logo.svg}" alt="Shared">
        <p class="brand-name">Shared</p>
        <p class="brand-tag">Viví experiencias únicas cerca tuyo</p>
    </div>
    <div class="auth-card" style="max-width:420px; width:100%">
        <h2>Iniciar sesión</h2>
        <div class="auth-error" th:if="${param.error}">Usuario o contraseña incorrectos</div>
        <div class="auth-error" th:if="${param.logout}">Cerraste sesión correctamente</div>
        <form th:action="@{/login}" method="post">
            <label>Usuario
                <input type="text" name="username" required autocomplete="username" class="form-input">
            </label>
            <label>Contraseña
                <input type="password" name="password" required autocomplete="current-password" class="form-input">
            </label>
            <button type="submit" class="btn-primary btn-block">Entrar</button>
        </form>
        <div class="auth-divider">o</div>
        <p class="auth-switch">¿No tenés cuenta?</p>
        <a class="btn-ghost" th:href="@{/register}">Crear cuenta nueva</a>
    </div>
</div>
</body>
</html>
