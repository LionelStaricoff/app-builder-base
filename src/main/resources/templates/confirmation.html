<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Confirmación')}"></head>
<body>
<main class="app-main">
    <div class="card" style="padding:1.5rem;background:var(--surface)">
        <div th:if="${reservation == null}" style="padding:1rem">
            <h2>Todavía no tenés reservas</h2>
            <a class="btn-primary" th:href="@{/feed}" style="background:#fff;color:#E91E63">Ver experiencias</a>
        </div>
        <div th:if="${reservation != null}">
            <p style="font-size:2rem;margin:.5rem 0" th:text="${(esCreador ? 'COBRASTE ' : 'PAGASTE ') + currencyCode + ' ' + #numbers.formatDecimal(monto, 1, 'COMMA', 2, 'POINT')}">PAGASTE MXN 0.00</p>
            <p th:text="${reservation.instance.experience.name}">Experiencia</p><p class="meta" th:text="${'Para ' + reservation.attendees + (reservation.attendees == 1 ? ' cupo' : ' cupos') + ' · llega a tu cuenta ' + currencyCode + ' ' + #numbers.formatDecimal(payout, 1, 'COMMA', 2, 'POINT') + ' menos 5% de comisión'}">Detalle</p>
            <!-- Salidas post-pago: chat grupal (solo si está disponible) y calendario -->
            <p th:if="${chatDisponible}" style="margin-top:.75rem">
                <a class="btn-primary" th:href="@{/chats/{id}(id=${reservation.instance.id})}">💬 Ir al chat grupal</a>
            </p>
            <p class="hint" th:if="${!chatDisponible}">El chat grupal se abre cuando se complete el pago.</p>
            <p style="margin-top:.75rem">
                <a class="btn-secondary" th:href="@{/reservations/{id}/calendar.ics(id=${reservation.id})}">📅 Añadir a mi calendario</a>
            </p>
            <a class="btn-primary" th:href="@{/reservations}">Mis reservas</a>
        </div>
    </div>
</main>
<nav th:replace="~{fragments/layout :: nav('feed')}"></nav>
</body>
</html>
