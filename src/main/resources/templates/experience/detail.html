<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${experience.name})}"></head>
<body>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<main class="app-main">
    <div class="card">
        <div class="carousel" data-carousel th:if="${not #lists.isEmpty(images)}">
            <div class="carousel-track" data-carousel-track>
                <figure class="carousel-slide" th:each="img : ${images}">
                    <img th:src="'data:image/png;base64,' + ${img.data}"
                         th:alt="${experience.name}" loading="lazy">
                </figure>
            </div>
            <button type="button" class="carousel-btn prev" data-carousel-prev aria-label="Anterior">‹</button>
            <button type="button" class="carousel-btn next" data-carousel-next aria-label="Siguiente">›</button>
            <div class="carousel-dots" data-carousel-dots></div>
            <span class="carousel-counter" data-carousel-counter>1 / 1</span>
        </div>
        <div class="carousel-empty" th:if="${#lists.isEmpty(images)}">Sin fotos todavía</div>
        <div style="padding:1rem">
            <h1 th:text="${experience.name}">Nombre</h1>
            <p class="meta">
                <span class="stars">★</span>
                <span th:text="${#numbers.formatDecimal(experience.ratingAverage, 1, 1)}">0.0</span>
                · <span class="pill" th:text="${experience.category}">Categoria</span>
                · ⏱ <span th:text="${experience.durationMinutes >= 60 ? T(java.lang.Math).floorDiv(experience.durationMinutes, 60) + ' h' + (T(java.lang.Math).floorMod(experience.durationMinutes, 60) > 0 ? ' ' + T(java.lang.Math).floorMod(experience.durationMinutes, 60) + ' min' : '') : experience.durationMinutes + ' min'}">2 h 30 min</span>
                · <strong th:text="${experienceCurrency} + ' ' + ${experience.price}">MXN 190</strong>
            </p>
            <p th:text="${experience.description}">Descripción</p>
            <p>
                <strong>Cupos:</strong>
                <span th:text="${experience.minCapacity} + ' a ' + ${experience.maxCapacity}">2 a 8</span>
            </p>

            <h3 th:if="${stops != null and not #lists.isEmpty(stops)}">Recorrido (<span th:text="${#lists.size(stops)}">3</span> paradas)</h3>
            <div th:if="${stops != null and not #lists.isEmpty(stops)}">
                <div id="detail-route-map" class="map-box" data-map="view-route" style="height:300px"
                     th:attr="data-stops=${stopsJson}"></div>
                <ol class="stops-timeline">
                    <li th:each="s : ${stops}">
                        <strong th:text="${s.placeName}">Lugar</strong>
                    </li>
                </ol>
            </div>
            <div th:if="${stops == null or #lists.isEmpty(stops)}">
                <div id="detail-map" class="map-box" data-map="view"
                     th:attr="data-lat=${experience.meetingLat},data-lng=${experience.meetingLng}"></div>
                <p class="hint">Punto de encuentro: <span th:text="${experience.meetingLat} + ', ' + ${experience.meetingLng}">0, 0</span></p>
            </div>

            <h3>Próximas fechas</h3>
            <div class="slot-list">
                <div th:if="${#lists.isEmpty(instances)}" class="empty">No hay fechas disponibles</div>
                <div class="card slot" th:each="inst : ${instances}">
                <p>
                    <strong th:text="${#temporals.format(inst.date, 'dd/MM/yyyy')} + ' — ' + ${#temporals.format(inst.startTime, 'HH:mm')}">01/11/2026 — 10:00</strong>
                </p>
                <div th:replace="~{experience/picker-modal :: picker(${inst.id})}"></div>
                <form th:if="${esDueno}"
                      th:action="@{/instances/{id}/cancel(id=${inst.id})}" method="post"
                      onsubmit="return confirm('¿Cancelar esta fecha? Se reembolsa el 100% a los inscritos.');">
                    <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                    <button type="submit" class="btn-secondary">Cancelar fecha</button>
                </form>
            </div>
            </div>
        </div>
    </div>
</main>
<nav th:replace="~{fragments/layout :: nav('feed')}"></nav>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script th:src="@{/js/map.js}"></script>
<script th:src="@{/js/carousel.js}"></script>
</body>
</html>
