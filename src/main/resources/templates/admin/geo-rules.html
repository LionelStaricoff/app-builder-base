<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Geo Rules</title></head>
<body>
  <h1>Reglas geográficas</h1>
  <p th:if="${message}" th:text="${message}"></p>
  <h2>Países</h2>
  <table>
    <tr><th>Código</th><th>País</th><th>Moneda</th><th>Mínimo</th><th>Identidad</th><th>Vehículo</th><th>Ciudades</th></tr>
    <tr th:each="c : ${countries}">
      <td th:text="${c.countryCode}"></td>
      <td th:text="${c.countryName}"></td>
      <td th:text="${c.currencyCode}"></td>
      <td th:text="${c.minFare}"></td>
      <td th:text="${c.requiresPersonalIdentity}"></td>
      <td th:text="${c.requiresVehicle}"></td>
      <td><a th:href="@{/admin/geo-rules/{id}/city/new(id=${c.id})}">+ ciudad</a></td>
    </tr>
  </table>
  <p><a href="/admin/geo-rules/new">Nueva regla de país</a></p>
  <h2>Overrides por ciudad</h2>
  <table>
    <tr><th>País</th><th>Ciudad</th><th>Moneda</th><th>Mínimo</th><th>Identidad</th><th>Vehículo</th></tr>
    <tr th:each="o : ${cityOverrides}">
      <td th:text="${o.countryRule.countryCode}"></td>
      <td th:text="${o.cityName}"></td>
      <td th:text="${o.currencyCode != null ? o.currencyCode : '(hereda)'}"></td>
      <td th:text="${o.minFare != null ? o.minFare : '(hereda)'}"></td>
      <td th:text="${o.requiresPersonalIdentity != null ? o.requiresPersonalIdentity : '(hereda)'}"></td>
      <td th:text="${o.requiresVehicle != null ? o.requiresVehicle : '(hereda)'}"></td>
    </tr>
  </table>
</body>
</html>
