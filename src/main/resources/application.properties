spring.application.name=share

spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update


# H2 file-based (compatible con futura migración a Postgres; sin CLOB)
#spring.datasource.url=jdbc:h2:file:./data/share
#spring.datasource.driver-class-name=org.h2.Driver
#spring.jpa.hibernate.ddl-auto=create
#spring.h2.console.enabled=true

# ============================================================================
# Constantes de negocio (Global Constraints del plan)
# Cada valor puede sobreescribirse con la variable de entorno indicada entre
# llaves; si no está definida, se usa el valor por defecto que la sigue.
# ============================================================================

# Comisión que cobra la plataforma sobre el monto total de la reserva (5%).
# Se guarda en Payment.commission al reservar (escrow retenido) y se usa para
# calcular el payout del creador: payout = monto - (monto * comisión).
# Entorno: ESCROW_COMMISSION (default: 0.05 = 5%)
# Uso: ReservationService, ReservationController
escrow.commission-rate=${ESCROW_COMMISSION:0.05}

# Días que el pago queda retenido en escrow (HELD) antes de liberarse
# automáticamente al creador, aunque nadie evalúe. Se mide desde heldAt
# (o desde COMPLETED en la liberación programada).
# Entorno: ESCROW_RELEASE_DAYS (default: 2 días)
# Uso: EscrowService, EscrowReleaseService
escrow.auto-release-days=${ESCROW_RELEASE_DAYS:2}

# Porcentaje de reembolso parcial al participante cuando cancela con
# 24 horas o menos de antelación (Caso 1): 0.5 = 50% del monto.
# Con más de 24h el reembolso es del 100%; los Casos 2 y 3 también 100%.
# Entorno: PARTIAL_REFOUND_RATE (default: 0.5 = 50%)
# Uso: CancellationService
partial-refund-rate=${PARTIAL_REFOUND_RATE:0.5}
