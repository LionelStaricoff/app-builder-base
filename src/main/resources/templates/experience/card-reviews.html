<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<body>
<!--/* Reseñas dentro de la card: mismo contenido del detalle, sin sección. */-->
<div th:fragment="section(reviews)" th:data-count="${#lists.size(reviews)}" class="space-y-2">
  <div class="rounded-2xl border border-dashed border-gray-200 p-4 text-center text-[11px] text-gray-500"
       th:if="${#lists.isEmpty(reviews)}">
    Todavía no hay reseñas. Sé la primera persona en contar cómo fue.
  </div>

  <div class="space-y-2" th:if="${!#lists.isEmpty(reviews)}">
    <article class="bg-white rounded-2xl border border-gray-100 p-3 shadow-sm" th:each="rv : ${reviews}">
      <div class="flex items-center justify-between gap-2 mb-1">
        <strong class="text-xs text-gray-900" th:text="${rv.username}">usuario</strong>
        <span class="text-[10px] text-gray-400"
              th:text="${T(com.openlab.mx.movo.shared.ui.UiLabels).mesAnio(rv.date)}">oct 2026</span>
      </div>
      <div class="flex items-center gap-1 text-amber-500 mb-1.5">
        <svg class="w-3 h-3" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.3 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/>
        </svg>
        <span class="text-[11px] font-bold text-gray-700" th:text="${rv.stars} + '/5'">5/5</span>
      </div>
      <p class="text-xs text-gray-600 leading-relaxed"
         th:if="${rv.text != null and !#strings.isEmpty(rv.text)}" th:text="${rv.text}">Texto de la reseña</p>
    </article>
  </div>
</div>
</body>
</html>
