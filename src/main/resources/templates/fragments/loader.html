<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<body>
    <!--
      Loader SVG reutilizable en toda la app:
        <span th:replace="~{fragments/loader :: spinner('Cargando…')}"></span>
      Accesible: role=status + aria-live anuncia el texto; el SVG es decorativo.
    -->
    <span th:fragment="spinner(label)" class="loader" role="status" aria-live="polite">
        <svg class="loader-svg" viewBox="0 0 48 48" width="26" height="26"
             aria-hidden="true" focusable="false">
            <circle class="loader-track" cx="24" cy="24" r="18" fill="none" stroke-width="5"></circle>
            <circle class="loader-head" cx="24" cy="24" r="18" fill="none" stroke-width="5"
                    stroke-linecap="round" stroke-dasharray="28 85"></circle>
        </svg>
        <span class="loader-label" th:text="${label} ?: 'Cargando…'">Cargando…</span>
    </span>
</body>
</html>
