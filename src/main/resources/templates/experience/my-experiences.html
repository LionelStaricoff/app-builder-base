<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tus Experiencias')}"></head>
<body>
<main class="app-main">
    <div class="page-hero">
        <h1>Tus experiencias</h1>
        <p>Creá, editá y mirá quién se anota</p>
    </div>

    <div class="tabs">
        <span class="tab active">Mis Experiencias</span>
        <a class="tab" th:href="@{/reservations}">Mis Reservas</a>
    </div>

    <div class="empty" th:if="${success}" th:text="${success}">OK</div>
    <div class="empty" th:if="${error}" th:text="${error}">Error</div>

    <div class="empty-illustration" th:if="${#lists.isEmpty(experiencias)}">
        <img th:src="@{/img/empty-mine.svg}" alt="Sin experiencias creadas">
        <p><strong>Todavía no creaste experiencias</strong></p>
        <p class="hint">Tocá el + y publicá la primera en minutos.</p>
        <a class="btn-primary" th:href="@{/experiences/new}">Crear la primera</a>
    </div>

    <div class="card" th:each="e : ${experiencias}" style="padding:0">
        <div class="carousel" data-carousel
             th:if="${covers != null and covers[e.id] != null and not #lists.isEmpty(covers[e.id])}">
            <div class="carousel-track" data-carousel-track>
                <figure class="carousel-slide" th:each="imgData : ${covers[e.id]}">
                    <a th:href="@{/experiences/{id}(id=${e.id})}">
                        <img th:src="'data:image/png;base64,' + ${imgData}"
                             th:alt="${e.name}" loading="lazy">
                    </a>
                </figure>
            </div>
            <button type="button" class="carousel-btn prev" data-carousel-prev aria-label="Anterior">‹</button>
            <button type="button" class="carousel-btn next" data-carousel-next aria-label="Siguiente">›</button>
            <div class="carousel-dots" data-carousel-dots></div>
            <span class="carousel-counter" data-carousel-counter>1 / 1</span>
        </div>
        <div style="padding:1rem">
        <div class="card-head">
            <h3><a th:href="@{/experiences/{id}(id=${e.id})}" th:text="${e.name}">Nombre</a></h3>
            <span class="chip" th:text="${e.status}">ACTIVE</span>
        </div>
        <p class="meta">
            <strong th:text="${e.currencyCode} + ' ' + ${e.price}">MXN 190</strong>
            · <span th:text="${e.category}">CULTURAL</span>
            · <span th:text="${e.minCapacity} + ' a ' + ${e.maxCapacity}">1 a 4</span>
        </p>
        <p style="display:flex;gap:.5rem;flex-wrap:wrap">
            <a class="btn-secondary" th:href="@{/experiences/{id}/edit(id=${e.id})}">Editar</a>
            <form th:action="@{/experiences/{id}/delete(id=${e.id})}" method="post"
                  th:onsubmit="'return confirm(\\'¿Eliminar esta experiencia?\\')'">
                <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                <button type="submit" class="btn-secondary">Eliminar</button>
            </form>
        </p>
        </div>
    </div>

    <a th:href="@{/experiences/new}" class="btn-primary"
       style="position:fixed;right:1rem;bottom:5rem;border-radius:50%;width:56px;height:56px;
              display:flex;align-items:center;justify-content:center;font-size:1.6rem;z-index:5">+</a>
</main>
<nav th:replace="~{fragments/layout :: nav('mine')}"></nav>
<script th:src="@{/js/carousel.js}"></script>
</body>
</html>
