<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Feed')}"></head>
<body class="bg-slate-50">
<link rel="stylesheet" th:href="@{/vendor/leaflet/leaflet.css}">
<main class="app-main app-main--wide" id="feed-main">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <!--/* CABECERA UNIFICADA PREMIUM RESPONSIVA */-->
    <div class="w-full max-w-7xl mx-auto space-y-6 mb-10 px-4 sm:px-6 lg:px-8 mt-6">
        <div class="relative overflow-hidden rounded-[2rem] bg-gradient-to-br from-rose-600 via-brand-600 to-pink-700 p-6 sm:p-10 shadow-2xl shadow-rose-950/60 border border-white/20">
          
          <!--/* Destellos decorativos de fondo */-->
          <div class="absolute -top-24 -right-24 w-64 h-64 bg-white/20 rounded-full blur-3xl pointer-events-none animate-pulseGlow"></div>
          <div class="absolute -bottom-20 -left-20 w-56 h-56 bg-purple-900/40 rounded-full blur-2xl pointer-events-none"></div>

          <div class="relative z-10 space-y-6">
            <!--/* FILA SUPERIOR: Título + chip de ubicación, todo en UNA sola fila */-->
            <div class="flex items-center gap-3 min-w-0">
              <h1 class="text-lg sm:text-3xl font-black tracking-tight text-white leading-tight truncate min-w-0">
                Descubrí experiencias
              </h1>

              <!--/* Chip / Badge compacto de Ubicación, al lado del título */-->
              <div id="location-chip" class="inline-flex items-center gap-1.5 bg-black/25 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/20 shadow-sm max-w-full min-w-0 shrink">
                  <span class="relative flex h-2.5 w-2.5 flex-shrink-0">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75"
                          th:classappend="${hasLocation} ? 'bg-emerald-400' : 'bg-slate-300'"></span>
                    <span class="relative inline-flex rounded-full h-2.5 w-2.5"
                          th:classappend="${hasLocation} ? 'bg-emerald-400' : 'bg-slate-400'"></span>
                  </span>

                  <svg class="w-3.5 h-3.5 text-rose-200 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                  </svg>

                  <span id="location-city" class="text-xs font-bold text-white tracking-wide truncate max-w-[80px] sm:max-w-none"
                        th:text="${savedCity != null and !#strings.isEmpty(savedCity) ? savedCity : 'Sin ubicación'}">Cartagena</span>

                  <!--/* Botón interactivo para actualizar GPS */-->
                  <button id="btn-gps" type="button" title="Actualizar ubicación GPS" aria-label="Actualizar ubicación GPS"
                          class="p-1 text-rose-200 hover:text-white hover:bg-white/20 rounded-full transition-all active:scale-90 ml-0.5 flex-shrink-0">
                    <svg id="gps-icon" class="w-3.5 h-3.5 transition-transform duration-500" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                    </svg>
                  </button>

                  <!--/* Lupa: abre/cierra el buscador. El ícono cambia de color al activarse */-->
                  <button id="btn-search" type="button" title="Buscar" aria-label="Buscar" aria-expanded="false" aria-controls="feed-search"
                          class="feed-search-toggle p-1 text-rose-200 hover:text-white hover:bg-white/20 rounded-full transition-all active:scale-90 ml-0.5 flex-shrink-0">
                    <svg id="search-icon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                  </button>
                </div>
            </div>

            <p class="text-rose-100 text-xs sm:text-sm opacity-90 font-medium">Explorá los mejores rincones del mundo</p>

            <!--/* BUSCADOR INTEGRADO: aparece y desaparece con la lupa de la cabecera */-->
            <div id="feed-search" class="feed-search" th:classappend="${searchedQuery != null} ? 'is-open'">
              <form th:action="@{/feed}" method="get" class="relative flex items-center">
                <div class="absolute left-3.5 pointer-events-none text-slate-400">
                  <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                  </svg>
                </div>
                <input
                  type="text"
                  name="city"
                  th:value="${searchedQuery}"
                  placeholder="Buscar por país y/o ciudad..."
                  class="w-full bg-white/95 backdrop-blur-xl text-slate-900 text-xs sm:text-sm font-medium pl-10 pr-24 py-3 sm:py-3.5 rounded-2xl border border-white/60 focus:bg-white focus:outline-none focus:ring-4 focus:ring-black/20 transition-all placeholder:text-slate-400 shadow-inner"
                >
                <button type="submit" class="absolute right-1.5 bg-slate-900 hover:bg-black active:scale-95 text-white font-bold text-xs px-3.5 sm:px-4 py-2 sm:py-2.5 rounded-xl shadow-md transition-all flex items-center gap-1">
                  <span>Buscar</span>
                </button>
                <!--/* conserva el filtro de categoría activo al buscar */-->
                <input type="hidden" name="category" th:if="${selectedCategory != null}" th:value="${selectedCategory}">
              </form>
            </div>

            <!--/* Carrusel de Categorías */-->
            <div class="pt-4">
              <div class="flex items-center justify-between text-white/80 text-[11px] font-semibold mb-3 px-1">
                <span class="uppercase tracking-widest opacity-80">Filtros por categoría</span>
                <span class="text-rose-200 animate-pulse">Deslizar →</span>
              </div>
              <div id="category-container" class="flex items-center gap-3 overflow-x-auto overflow-y-hidden no-scrollbar py-2 w-full">
                <!--/* Todas */-->
                <a th:href="@{/feed}" th:classappend="${selectedCategory == null} ? 'bg-white text-rose-600 font-extrabold shadow-md' : 'bg-black/20 text-white font-medium border border-white/15'" 
                   class="category-pill opacity-0 animate-stagger stagger-1 flex-shrink-0 inline-flex items-center gap-1.5 text-xs px-5 py-2.5 rounded-xl transition-all active:scale-95">
                  <svg class="w-3.5 h-3.5" th:classappend="${selectedCategory == null} ? 'text-rose-600' : 'text-white'" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
                  </svg>
                  <span class="whitespace-nowrap">Todas</span>
                </a>
                <!--/* Dinámicas */-->
                <a th:each="c, iterStat : ${categories}" 
                   th:href="@{/feed(category=${c})}" 
                   th:classappend="${selectedCategory == c} ? 'bg-white text-rose-600 font-extrabold shadow-md' : 'bg-black/20 text-white font-medium border border-white/15' + ' stagger-' + ${iterStat.index + 2}"
                   class="category-pill opacity-0 animate-stagger flex-shrink-0 inline-flex items-center gap-1.5 text-xs px-5 py-2.5 rounded-xl transition-all active:scale-95">
                  <span class="whitespace-nowrap" th:text="${c.label}">Categoria</span>
                </a>
              </div>
            </div>
          </div>
        </div>
    </div>

    <div class="empty-illustration" th:if="${feedPage.empty}">
        <img th:src="@{/img/empty-feed.svg}" alt="Sin experiencias">
        <p><strong>Todavía no hay experiencias por acá</strong></p>
        <p class="hint">¡Creá la primera y estrená el feed!</p>
        <a class="btn-primary" th:if="${puedePublicar}" th:href="@{/experiences/new}">Crear experiencia</a>
        <a class="btn-secondary" th:unless="${puedePublicar}" th:href="@{/verificacion}">Verificá tu identidad para publicar</a>
    </div>

    <div id="feed-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto pb-20">
        <th:block th:replace="~{fragments/feed-card :: cards(${feedPage})}"></th:block>
    </div>

    <div id="feed-sentinel" style="height:1px"></div>
    <div id="feed-loading" class="empty" hidden>
        <span th:replace="~{fragments/loader :: spinner('Cargando más experiencias…')}">Cargando…</span>
    </div>
</main>
<nav th:replace="~{fragments/layout :: nav('feed')}"></nav>
<script th:src="@{/vendor/leaflet/leaflet.js}"></script>
<script th:src="@{/js/map.js}"></script>
<script th:src="@{/js/carousel.js}"></script>
<script th:src="@{/js/feed-infinite.js}"></script>
<script th:src="@{/js/feed-location.js}"></script>
<script th:src="@{/js/feed-categories.js}"></script>
<script th:src="@{/js/feed-search.js}"></script>
</body>
</html>
