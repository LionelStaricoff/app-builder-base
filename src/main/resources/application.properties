spring.application.name=movo

spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

# ============================================================================
# Esquema de la base: lo administra FLYWAY, no Hibernate.
# Las migraciones (src/main/resources/db/migration) son la fuente de verdad:
# V1__baseline = el esquema que ya existía; V2 = Stripe Connect.
# ddl-auto=validate => Hibernate NO crea ni altera nada: solo COMPRUEBA que el
# esquema coincida con las entidades y falla al arrancar si hay drift. Antes
# (ddl-auto=update) Hibernate mutaba la base en cada arranque, en silencio.
# baseline-on-migrate: la base de dev/prod ya existe y no tiene historial de
# Flyway -> se marca como "V1 aplicada" y sigue V2. Una base NUEVA (vacía) no
# se baselinea: corre V1 y V2 completas.
# ============================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

# HikariCP contra Postgres remoto: los defaults (maxLifetime 30 min, sin
# keepalive) dejan conexiones muertas en el pool cuando el servidor, la nube
# o un NAT/firewall cortan el TCP idle. Resultado: ráfagas de
# "Failed to validate connection ... closed" y requests que cuelgan o fallan
# al toparse con el pool muerto (ej. el POST /location).
# maxLifetime (3 min) va POR DEBAJO del idle-timeout típico de la nube/NAT y
# el keepalive (30 s) mantiene vivas las idle y el mapeo NAT.
# Entorno: HIKARI_MAX_LIFETIME / HIKARI_KEEPALIVE_TIME /
# HIKARI_CONNECTION_TIMEOUT / HIKARI_VALIDATION_TIMEOUT
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:180000}
spring.datasource.hikari.keepalive-time=${HIKARI_KEEPALIVE_TIME:30000}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:10000}
spring.datasource.hikari.validation-timeout=${HIKARI_VALIDATION_TIMEOUT:3000}


# Subida de imágenes: el default de Spring Boot es 1 MB por archivo, cualquier
# foto real (iPhone/Mac) lo supera y el POST falla con MaxUploadSizeExceeded.
# Entorno: SPRING_MULTIPART_MAX_FILE_SIZE / SPRING_MULTIPART_MAX_REQUEST_SIZE
spring.multipart.max-file-size=${SPRING_MULTIPART_MAX_FILE_SIZE:5MB}
spring.multipart.max-request-size=${SPRING_MULTIPART_MAX_REQUEST_SIZE:25MB}

# H2 file-based: solo para experimenting local sin tocar la BD real. OJO: es el
# ÚNICO caso donde el DataSeeder (datos precargados) se activa, porque su
# condición es "el datasource es H2". Para esto, comentá las 3 líneas de
# SPRING_DATASOURCE_* de arriba y descomentá estas.
#spring.datasource.url=jdbc:h2:file:./data/share
#spring.datasource.driver-class-name=org.h2.Driver
#spring.jpa.hibernate.ddl-auto=create
#spring.h2.console.enabled=true

# ============================================================================
# Constantes de negocio (Global Constraints del plan)
# Cada valor puede sobreescribirse con la variable de entorno indicada entre
# llaves; si no está definida, se usa el valor por defecto que la sigue.
# ============================================================================

# Comisión que cobra la plataforma sobre el monto total de la reserva (5%).
# Se guarda en Payment.commission al reservar (escrow retenido) y se usa para
# calcular el payout del creador: payout = monto - (monto * comisión).
# Entorno: ESCROW_COMMISSION (default: 0.05 = 5%)
# Uso: ReservationService, ReservationController
escrow.commission-rate=${ESCROW_COMMISSION:0.05}

# Spec §8: Stripe Checkout (keys SOLO por env vars, jamás commiteadas).
# Sin secret-key configurada el POST de checkout falla con mensaje claro.
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# Lista blanca de países donde Stripe permite crear cuentas Connect
# (ver https://stripe.com/global — ej.: Colombia NO está soportada y
# Account.create(country=CO) falla con country_unsupported). El creador
# elige su país de cobro solo entre esta lista.
# Entorno: STRIPE_PAYOUT_COUNTRIES (default: la lista completa de abajo)
# Uso: StripeConnectService, selector en creators/onboarding.html
app.stripe.payout-countries=${STRIPE_PAYOUT_COUNTRIES:MX,BR,US,CA,ES,GB,FR,DE,IT,PT,NL,BE,AT,IE,SE,DK,FI,NO,PL,CZ,AU,NZ,SG,JP,HK,AE,CH}

# URL pública de la app para success_url/cancel_url de la Checkout Session.
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Días que el pago queda retenido en escrow (HELD) antes de liberarse
# automáticamente al creador, aunque nadie evalúe. Se mide desde heldAt
# (o desde COMPLETED en la liberación programada).
# Entorno: ESCROW_RELEASE_DAYS (default: 2 días)
# Uso: EscrowService, EscrowReleaseService
escrow.auto-release-days=${ESCROW_RELEASE_DAYS:2}

# ============================================================================
# Didit (verificación de identidad / KYC). Keys SOLO por env vars, jamás
# commiteadas. Sin api-key el DiditSessionsClient cae en el no-configurado.
# DIDIT_CALLBACK_URL: URL pública a la que Didit devuelve al usuario después
# del flujo hosteado (se revalida contra el back, nunca contra query params).
# ============================================================================
didit.api-key=${DIDIT_API_KEY:}
didit.workflow-id=${DIDIT_WORKFLOW_ID:}
didit.webhook-secret=${DIDIT_WEBHOOK_SECRET:}
didit.base-url=${DIDIT_BASE_URL:https://verification.didit.me}
didit.callback-url=${DIDIT_CALLBACK_URL:${app.base-url}/verificacion/callback}

# Kill-switch temporal del gate de identidad verificada (KYC). Default true.
# Para probar la app sin verificación, setear IDENTITY_VERIFICATION_ENABLED=false
# (o identity.verification.enabled=false). NO deshabilitar en producción.
identity.verification.enabled=${IDENTITY_VERIFICATION_ENABLED:true}

# Política de reembolso por anticipación (Caso 1: el participante cancela).
# Tramos "horas:proporción" separados por coma. Aplica el primer tramo cuyo
# tiempo restante supere las horas indicadas; el último tramo es el respaldo
# (también cubre las fechas ya iniciadas).
# La proporción es lo que se devuelve al participante: 0.90 = con más de 24 h
# de anticipación se devuelve el 90% y la plataforma retiene el 10%; 0.50 =
# con 24 h o menos se devuelve el 50%. Los Casos 2 y 3 (creador cancela la
# fecha / cupo mínimo) siempre reembolsa el 100%.
# Entorno: REFUND_TIERS (default: 24:0.90,0:0.50)
# Uso: RefundPolicy, CancellationService
refund.tiers=${REFUND_TIERS:24:0.90,0:0.50}

# Zona horaria de la plataforma (id IANA). Vacío = zona del sistema (comportamiento
# histórico). La usan los cálculos de plazos y duraciones (reembolsos, escrow,
# firmas). Importante en producción: el servidor puede estar en UTC mientras la
# experiencia del creador está en hora local de su país.
# Entorno: APP_TIME_ZONE (default: zona del sistema)
# Uso: TimeConfig (bean Clock)
app.time-zone=${APP_TIME_ZONE:}

# ============================================================================
# Datos precargados (DataSeeder): 2 cuentas de ejemplo (demo_creator / demo_user).
# REGLA: los datos precargados existen SOLO contra H2 (tests / local). Contra
# Postgres el seeder no se crea (H2DatasourceCondition), así que un despliegue
# nunca siembra cuentas demo en la base real.
# La contraseña NO se commitea: va por variable de entorno. Si viene vacía el
# seeder aborta (no crea usuarios con contraseña vacía).
# Entorno: DEMO_PASSWORD (default: Clave1234!), APP_DEMO_ENABLED (default: true)
# Uso: DataSeeder
# ============================================================================
app.demo.password=${DEMO_PASSWORD:Clave1234!}
app.demo.enabled=${APP_DEMO_ENABLED:true}

# ============================================================================
# Propuesta de experiencia con IA (spec 2026-10-26-ai-proposal-design.md §4.5)
# AI_CHAT_PROVIDER = switch único de proveedor:
#   none (default) | google-genai | openai | ollama
# Sin provider (o sin key del elegido) ProposalConfig elige el stub
# determinista: el flujo queda activo en local/tests sin tocar nada.
# Uso: ProposalConfig / AiProposalGenerator
# ============================================================================
# ai.proposal.provider: auto (elegir segun key/provider) | stub (forzar)
# OJO: .properties no soporta comentarios en linea: el # quedaria en el valor.
spring.ai.model.chat=${AI_CHAT_PROVIDER:none}
ai.proposal.provider=${AI_PROPOSAL_PROVIDER:auto}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-2.5-flash}
# Verificado contra los .class de la 2.0.2: la 2.0 achato `.options`
# (spring.ai.openai.chat.options.model ya no existe).
spring.ai.openai.chat.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.ollama.chat.model=${OLLAMA_MODEL:llama3.2}
# Solo usamos chat: el resto de tipos de modelo quedan apagados aunque el
# starter este en el classpath (los autoconfigs tienen matchIfMissing=true y
# sus clientes validan la key al arrancar — sin key romperian el boot).
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.embedding=none
spring.ai.model.embedding.text=none
spring.ai.model.image=none
spring.ai.model.moderation=none

# Movo operacion (Tarea 6)
movo.debt.limit.mxn=
movo.default.currency=
