<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<body>
<!--/*
  Fragmentos de fecha de la card del feed.

  - picker: las fechas futuras como botones. El JS los inyecta en el panel de
    la card y, al elegir una, pide availabilityContent para refrescar cupos y
    avatares SIN recargar la página.
  - availabilityContent: el bloque interno de cupos, compartido por el render
    inicial (feed-card.html) y por el endpoint de disponibilidad. Una sola
    definición de "cómo se pintan los cupos".
*/-->
<th:block th:fragment="picker(experienceId, dates, selectedInstanceId)">
  <p th:if="${#lists.isEmpty(dates)}" class="text-xs text-gray-500 px-1 py-2">
    No hay fechas disponibles.
  </p>
  <div th:unless="${#lists.isEmpty(dates)}" class="grid grid-cols-2 gap-2">
    <button type="button"
            th:each="d : ${dates}"
            th:with="label=${T(com.openlab.mx.share.shared.ui.UiLabels).fechaCorta(d.date)},
                     aria=${'Elegir fecha ' + T(com.openlab.mx.share.shared.ui.UiLabels).fechaCorta(d.date)
                             + ' a las ' + #temporals.format(d.startTime, 'HH:mm')
                             + ', ' + d.availableCapacity + ' lugares libres'}"
            data-date-option
            th:data-instance-id="${d.instanceId}"
            th:data-date-label="${label}"
            th:aria-label="${aria}"
            th:disabled="${d.availableCapacity == 0}"
            th:classappend="${d.instanceId == selectedInstanceId} ? 'ring-2 ring-teal-300 bg-teal-50' : 'bg-white'"
            class="flex flex-col items-start gap-0.5 rounded-xl border border-gray-200 px-3 py-2 text-left transition-colors hover:border-teal-300 disabled:opacity-40 disabled:cursor-not-allowed">
      <span class="text-xs font-bold text-gray-900" th:text="${label}">24 oct</span>
      <span class="text-[10px] text-gray-500"
            th:text="${#temporals.format(d.startTime, 'HH:mm') + ' · ' + d.availableCapacity + ' libres'}">10:00 · 6 libres</span>
    </button>
  </div>
</th:block>

<th:block th:fragment="availabilityContent(maxCapacity, availableCapacity, reservedCount, reservedAvatars)">
  <div class="flex justify-between items-center gap-2 text-xs">
    <span class="font-semibold text-gray-800 whitespace-nowrap">Lugares libres</span>
    <span class="text-gray-400 font-medium text-[11px] whitespace-nowrap"
          th:text="${maxCapacity + ' cupos'}">10 cupos</span>
  </div>
  <div class="w-full bg-gray-200 h-2 rounded-full overflow-hidden">
    <div class="bg-teal-700 h-full rounded-full transition-all duration-300"
         th:style="'width:' + ${maxCapacity > 0 ? T(java.lang.Math).round(reservedCount * 100.0 / maxCapacity) : 0} + '%'"></div>
  </div>
  <div class="flex items-center justify-between text-[11px] text-gray-500">
    <div class="flex items-center gap-1.5">
      <div class="flex -space-x-1.5">
        <img th:each="av : ${reservedAvatars}"
             class="w-4 h-4 rounded-full ring-1 ring-white object-cover"
             th:src="'data:image/jpeg;base64,' + ${av}" alt="">
      </div>
      <span th:text="${reservedCount} + ' reservaron'">2 reservaron</span>
    </div>
    <span class="font-bold text-teal-700" th:text="${availableCapacity + ' libres'}">6 libres</span>
  </div>
</th:block>
</body>
</html>
