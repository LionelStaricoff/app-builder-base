<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Mis reservas')}"></head>
<body>
<main class="app-main">
    <div class="page-hero">
        <h1>Mis reservas</h1>
        <p>Tus próximas fechas y las que esperan confirmación</p>
    </div>

    <!--/* Dos pantallas distintas, no dos pestañas: cada una tiene su URL. */-->
    <nav class="tabs" aria-label="Experiencias y reservas">
        <a class="tab" th:href="@{/my-experiences}">Mis Experiencias</a>
        <span class="tab active" aria-current="page">Mis Reservas</span>
    </nav>

    <div class="empty" th:if="${ok}" th:text="${ok}">OK</div>
    <div class="empty" th:if="${error}" th:text="${error}">Error</div>

    <div class="empty-illustration" th:if="${#lists.isEmpty(reservations)}">
        <img th:src="@{/img/empty-reservations.svg}" alt="">
        <p><strong>Todavía no reservaste nada</strong></p>
        <p class="hint">Reservá tu primera experiencia y aparece acá con fecha y cupos.</p>
        <a class="btn-primary" th:href="@{/feed}">Ver experiencias</a>
    </div>

    <div class="grid gap-4" th:unless="${#lists.isEmpty(reservations)}">
        <article class="card section" th:each="r : ${reservations}">
            <div class="section-head">
                <h2 class="section-title" th:text="${r.instance.experience.name}">Experiencia</h2>
                <span class="chip" th:text="${r.status.label}">Pendiente</span>
            </div>

            <p class="meta">
                <span th:text="${T(com.openlab.mx.movo.shared.ui.UiLabels).fechaCorta(r.instance.date)}">24 oct</span>
                · <span th:text="${r.attendees}">1</span> <span th:text="${r.attendees == 1 ? 'cupo' : 'cupos'}">cupos</span>
            </p>

            <form th:if="${r.status.name() != 'CANCELADO'}"
                  th:action="@{/reservations/{id}/cancel(id=${r.id})}" method="post">
                <button type="submit" class="btn-secondary"
                        th:text="${'Cancelar reserva · devuelve ' + (refundPercent[r.id] ?: '—') + '%'}">
                    Cancelar reserva · devuelve 90%
                </button>
            </form>

            <form th:if="${r.status.name() == 'CONFIRMADA'}"
                  th:action="@{/instances/{id}/rate(id=${r.instance.id})}" method="post" class="rate-form">
                <label class="hint">Estrellas
                    <select name="stars">
                        <option th:each="s : ${#numbers.sequence(1,5)}" th:value="${s}" th:text="${s}">5</option>
                    </select>
                </label>
                <label class="hint" style="flex:1">Comentario
                    <input type="text" name="text" placeholder="¿Qué tal estuvo?">
                </label>
                <button type="submit" class="btn-primary">Evaluar</button>
            </form>
        </article>
    </div>
</main>
<nav th:replace="~{fragments/layout :: nav('mine')}"></nav>
</body>
</html>
