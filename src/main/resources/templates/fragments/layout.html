<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#E91E63">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Shared">
    <link rel="apple-touch-icon" th:href="@{/icons/icon-192.png}">
    <title th:text="${title} ?: 'Shared'">Shared</title>
    <link rel="manifest" th:href="@{/manifest.webmanifest}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- v=2: subir al tocar app.css para que el navegador no sirva el viejo cacheado -->
    <link rel="stylesheet" th:href="@{/css/app.css(v=6)}">
    <script>
      /* Theme — ÚNICA fuente de verdad del estilo visual (opción B).
         Dueño único: data-style="1|2|3" + localStorage.visualStyle.
         El viejo sistema data-dark-mode/localStorage.darkMode se elimina:
         nunca tuvo reglas CSS y su <script> del <body> jamás se incluía
         (las páginas solo piden los fragmentos head y nav). */
      (function () {
        var KEY = 'visualStyle';
        var PREV_KEY = 'visualStylePrev';
        function read(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
        function write(key, val) { try { localStorage.setItem(key, val); } catch (e) { /* storage no disponible */ } }
        function markActive(s) {
          var buttons = document.querySelectorAll('[data-visual-style]');
          buttons.forEach(function (btn) {
            btn.classList.toggle('active', btn.getAttribute('data-visual-style') === s);
          });
        }
        function current() { return read(KEY) || '1'; }
        function set(styleNum) {
          var s = String(styleNum);
          if (s !== '1' && s !== '2' && s !== '3') { s = '1'; }
          document.documentElement.setAttribute('data-style', s);
          write(KEY, s);
          markActive(s);
        }
        function toggleDark() {
          var cur = current();
          if (cur === '3') {
            var prev = read(PREV_KEY) || '1';
            set(prev === '3' ? '1' : prev);
          } else {
            write(PREV_KEY, cur);
            set('3');
          }
        }
        window.Theme = {
          get: current,
          set: set,
          toggleDark: toggleDark,
          isDark: function () { return current() === '3'; }
        };
        window.setStyle = set; /* alias compat: settings.html y código viejo */
        /* Migración legacy + restore temprano anti-FOUC en TODAS las páginas */
        var vs = read(KEY);
        if (!vs) {
          var legacyDark = null;
          try { legacyDark = localStorage.getItem('darkMode'); } catch (e) { /* nada */ }
          vs = (legacyDark === 'true' || legacyDark === true) ? '3' : '1';
          write(KEY, vs);
          try { localStorage.removeItem('darkMode'); } catch (e) { /* nada */ }
          try { document.documentElement.removeAttribute('data-dark-mode'); } catch (e) { /* nada */ }
        }
        document.documentElement.setAttribute('data-style', vs);
      })();
    </script>
    <script th:src="@{/js/sw-register.js}" defer></script>
    <script th:src="@{/js/loader.js}" defer></script>
    <script th:src="@{/js/share-sheet.js}" defer></script>
</head>
<body>
<nav th:fragment="nav(active)" class="bottom-nav">
    <a th:href="@{/feed}" th:classappend="${active == 'feed'} ? 'active'">
        <span class="icon">🏠</span>Feed
    </a>
    <a th:href="@{/favorites}" th:classappend="${active == 'favorites'} ? 'active'">
        <span class="icon">❤️</span>Favoritos
    </a>
    <a th:href="@{/my-experiences}" th:classappend="${active == 'mine'} ? 'active'">
        <span class="icon">➕</span>Tus Experiencias
    </a>
    <a th:href="@{/notifications}" th:classappend="${active == 'notifications'} ? 'active'">
        <span class="icon">🔔</span>Avisos
    </a>
    <a th:href="@{/chats}" th:classappend="${active == 'chats'} ? 'active'">
        <span class="icon">💬</span>Chats
    </a>
    <a th:href="@{/settings}" th:classappend="${active == 'settings'} ? 'active'">
        <span class="icon">⚙️</span>Config
    </a>
</nav>
</body>
</html>
