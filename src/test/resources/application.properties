# Tests: H2 en memoria. OJO: este archivo NO se mergea con el de main,
# lo SHADOWEA por completo (misma location classpath:/, gana test-classes).
# Por eso tiene que ser self-contained: todo @Value que el contexto necesite
# (escrow.*, partial-refund-rate, multipart) va repetido aca con literales.
# Literales a proposito: los tests tienen que ser deterministicos, sin depender
# del .env ni de variables de entorno.
spring.datasource.url=jdbc:h2:mem:sharedtest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false

spring.multipart.max-file-size=5MB
spring.multipart.max-request-size=25MB

escrow.commission-rate=0.05

# Secret del webhook para tests (antes estaba como @SpringBootTest(properties=...)
# en StripeWebhookControllerTests, lo que creaba un contexto Spring separado con
# otro FakePaymentGateway y colisionaba de session ids contra la H2 compartida).
stripe.webhook-secret=whsec_test

# Didit para tests: secret de firma del webhook (el signer de tests usa lo
# mismo) y workflow/callback cualquiera — el cliente de sesiones se reemplaza
# por un fake en TestDiditConfig, nunca se llama a la red.
didit.api-key=test-key
didit.webhook-secret=whsec_test
didit.workflow-id=wf-test
didit.base-url=https://verification.didit.me
didit.callback-url=http://localhost/verificacion/callback
escrow.auto-release-days=2
partial-refund-rate=0.5
