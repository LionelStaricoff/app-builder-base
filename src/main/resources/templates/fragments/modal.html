<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<body>
<div th:fragment="confirm(id, message, action)" class="modal" th:id="${id}" hidden>
    <div class="modal-box card">
        <p th:text="${message}">Mensaje</p>
        <form th:action="${action}" method="post">
            <button type="submit" class="btn-primary">Confirmar</button>
            <button type="button" th:onclick="'document.getElementById(\'' + ${id} + '\').setAttribute(\'hidden\', \'hidden\')'">Cancelar</button>
        </form>
    </div>
</div>
</body>
</html>
