<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registrarse')}"></head>
<body>
<div class="auth-screen">
    <div class="auth-brand">
        <img th:src="@{/img/logo.svg}" alt="Shared">
        <p class="brand-name">Shared</p>
        <p class="brand-tag">Creá tu cuenta y empezá a vivir</p>
    </div>
    <div class="auth-card" style="max-width:420px; width:100%">
        <h2>Crear cuenta</h2>
        <div class="auth-error" th:if="${error}" th:text="${error}">Error</div>
        <form th:action="@{/register}" th:object="${registerRequest}" method="post">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
            <label>Usuario
                <input type="text" th:field="*{username}" required autocomplete="username" class="form-input">
            </label>
            <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Error</p>
            <label>Email
                <input type="email" th:field="*{email}" required autocomplete="email" class="form-input">
            </label>
            <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Error</p>
            <label>Contraseña (mínimo 8 caracteres)
                <input type="password" th:field="*{password}" required autocomplete="new-password" class="form-input">
            </label>
            <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Error</p>
            <label>Fecha de nacimiento (debes tener 18 años o más)
                <input type="date" th:field="*{birthDate}" required class="form-input">
            </label>
            <p th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}">Error</p>
            <div class="form-grid">
                <label>País
                    <select th:field="*{country}" id="country-select" required class="form-input">
                        <option value="">Elegí tu país</option>
                        <option value="México">México</option>
                        <option value="Argentina">Argentina</option>
                        <option value="Colombia">Colombia</option>
                        <option value="Chile">Chile</option>
                        <option value="Perú">Perú</option>
                        <option value="Uruguay">Uruguay</option>
                        <option value="España">España</option>
                        <option value="Estados Unidos">Estados Unidos</option>
                        <option value="Brasil">Brasil</option>
                    </select>
                </label>
                <label>Moneda
                    <select th:field="*{currencyCode}" id="currency-select" required class="form-input">
                        <option value="">Moneda</option>
                        <option value="MXN">MXN — Peso mexicano</option>
                        <option value="ARS">ARS — Peso argentino</option>
                        <option value="COP">COP — Peso colombiano</option>
                        <option value="CLP">CLP — Peso chileno</option>
                        <option value="PEN">PEN — Sol peruano</option>
                        <option value="UYU">UYU — Peso uruguayo</option>
                        <option value="EUR">EUR — Euro</option>
                        <option value="USD">USD — Dólar</option>
                        <option value="BRL">BRL — Real</option>
                    </select>
                </label>
            </div>
            <p class="hint">Usamos tu país para mostrarte los precios en tu moneda local.</p>
            <button type="submit" class="btn-primary btn-block">Registrarme</button>
        </form>
        <script>
            // Sincroniza moneda sugerida al elegir país (el usuario igual puede cambiarla).
            (function () {
                var map = { 'México': 'MXN', 'Argentina': 'ARS', 'Colombia': 'COP', 'Chile': 'CLP', 'Perú': 'PEN', 'Uruguay': 'UYU', 'España': 'EUR', 'Estados Unidos': 'USD', 'Brasil': 'BRL' };
                var country = document.getElementById('country-select');
                var currency = document.getElementById('currency-select');
                if (!country || !currency) return;
                country.addEventListener('change', function () {
                    var sugerida = map[country.value];
                    if (sugerida) currency.value = sugerida;
                });
            })();
        </script>
        </form>
        <div class="auth-divider">o</div>
        <p class="auth-switch">¿Ya tenés cuenta?</p>
        <a class="btn-ghost" th:href="@{/login}">Iniciá sesión</a>
    </div>
</div>
</body>
</html>
