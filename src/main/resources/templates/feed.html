<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Feed')}"></head>
<body>
<main class="app-main" id="feed-main">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <div class="chips">
        <a class="chip" th:classappend="${selectedCategory == null} ? 'active'"
           th:href="@{/feed}">Todas</a>
        <a class="chip" th:each="c : ${categories}"
           th:classappend="${selectedCategory == c} ? 'active'"
           th:href="@{/feed(category=${c})}" th:text="${c}">Categoria</a>
    </div>

    <div class="empty" th:if="${feedPage.empty}">No hay experiencias todavía. ¡Creá la primera!</div>

    <div id="feed-list">
        <div class="card" th:each="dto : ${feedPage.content}" th:id="'card-' + ${dto.id}">
            <img class="cover" th:if="${dto.coverBase64 != null}"
                 th:src="'data:image/png;base64,' + ${dto.coverBase64}" th:alt="${dto.name}">
            <div style="padding:1rem">
                <div class="card-head">
                    <h3><a th:href="@{/experiences/{id}(id=${dto.id})}" th:text="${dto.name}">Nombre</a></h3>
                    <form th:action="${dto.favorite}
                            ? @{/favorites/{id}/remove(id=${dto.id})}
                            : @{/favorites/{id}/add(id=${dto.id})}" method="post" class="heart">
                        <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                        <button type="submit" th:text="${dto.favorite} ? '❤️' : '🤍'">❤️</button>
                    </form>
                </div>
                <p th:text="${dto.description}">Descripción</p>
                <p class="meta">
                    📍 <span th:text="${dto.meetingPointLabel}">0, 0</span>
                    · ⏱ <span th:text="${dto.durationMinutes} + ' min'">60 min</span>
                    · 📅 <span th:text="${dto.nextDate} ?: 'Sin fecha'">2026-12-01</span>
                    · <strong th:text="'$' + ${dto.price} + ' MXN'">$190 MXN</strong>
                </p>
                <p class="meta"><span class="stars">★</span>
                    <span th:text="${#numbers.formatDecimal(dto.ratingAverage, 1, 1)}">0.0</span></p>
                <a class="btn-primary" th:href="@{/experiences/{id}(id=${dto.id})}">Reservar</a>
            </div>
        </div>
    </div>

    <div id="feed-sentinel" style="height:1px"></div>
    <div id="feed-loading" class="empty" hidden>Cargando…</div>
</main>
<script th:src="@{/js/feed-infinite.js}"></script>
</body>
</html>
