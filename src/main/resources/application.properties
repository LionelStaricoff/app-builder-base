# ============================================================================
# Constantes de negocio (Global Constraints del plan)
# Cada valor puede sobreescribirse con la variable de entorno indicada entre
# llaves; si no estÃ¡ definida, se usa el valor por defecto que la sigue.
# ============================================================================

# ComisiÃ³n que cobra la plataforma sobre el monto total de la reserva (5%).
# Se guarda en Payment.commission al reservar (escrow retenido) y se usa para
# calcular el payout del creador: payout = monto - (monto * comisiÃ³n).
# Entorno: ESCROW_COMMISSION (default: 0.05 = 5%)
# Uso: ReservationService, ReservationController
escrow.commission-rate=${ESCROW_COMMISSION:0.05}

# Spec Â§8: Stripe Checkout (keys SOLO por env vars, jamÃ¡s commiteadas).
# Sin secret-key configurada el POST de checkout falla con mensaje claro.
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# Lista blanca de paÃ­ses donde Stripe permite crear cuentas Connect
# (ver https://stripe.com/global â€” ej.: Colombia NO estÃ¡ soportada y
# Account.create(country=CO) falla con country_unsupported). El creador
# elige su paÃ­s de cobro solo entre esta lista.
# Entorno: STRIPE_PAYOUT_COUNTRIES (default: la lista completa de abajo)
# Uso: StripeConnectService, selector en creators/onboarding.html
app.stripe.payout-countries=${STRIPE_PAYOUT_COUNTRIES:MX,BR,US,CA,ES,GB,FR,DE,IT,PT,NL,BE,AT,IE,SE,DK,FI,NO,PL,CZ,AU,NZ,SG,JP,HK,AE,CH}

# URL pÃºblica de la app para success_url/cancel_url de la Checkout Session.
app.base-url=${APP_BASE_URL:http://localhost:8080}

# DÃ­as que el pago queda retenido en escrow (HELD) antes de liberarse
# automÃ¡ticamente al creador, aunque nadie evalÃºe. Se mide desde heldAt
# (o desde COMPLETED en la liberaciÃ³n programada).
# Entorno: ESCROW_RELEASE_DAYS (default: 2 dÃ­as)
# Uso: EscrowService, EscrowReleaseService
escrow.auto-release-days=${ESCROW_RELEASE_DAYS:2}

# ============================================================================
# Didit (verificaciÃ³n de identidad / KYC). Keys SOLO por env vars, jamÃ¡s
# commiteadas. Sin api-key el DiditSessionsClient cae en el no-configurado.
# DIDIT_CALLBACK_URL: URL pÃºblica a la que Didit devuelve al usuario despuÃ©s
# del flujo hosteado (se revalida contra el back, nunca contra query params).
# ============================================================================
didit.api-key=${DIDIT_API_KEY:}
didit.workflow-id=${DIDIT_WORKFLOW_ID:}
didit.webhook-secret=${DIDIT_WEBHOOK_SECRET:}
didit.base-url=${DIDIT_BASE_URL:https://verification.didit.me}
didit.callback-url=${DIDIT_CALLBACK_URL:${app.base-url}/verificacion/callback}

# PolÃ­tica de reembolso por anticipaciÃ³n (Caso 1: el participante cancela).
# Tramos "horas:proporciÃ³n" separados por coma. Aplica el primer tramo cuyo
# tiempo restante supere las horas indicadas; el Ãºltimo tramo es el respaldo
# (tambiÃ©n cubre las fechas ya iniciadas).
# La proporciÃ³n es lo que se devuelve al participante: 0.90 = con mÃ¡s de 24 h
# de anticipaciÃ³n se devuelve el 90% y la plataforma retiene el 10%; 0.50 =
# con 24 h o menos se devuelve el 50%. Los Casos 2 y 3 (creador cancela la
# fecha / cupo mÃ­nimo) siempre reembolsa el 100%.
# Entorno: REFUND_TIERS (default: 24:0.90,0:0.50)
# Uso: RefundPolicy, CancellationService
refund.tiers=${REFUND_TIERS:24:0.90,0:0.50}

# ============================================================================
# Datos precargados (DataSeeder): 2 cuentas de ejemplo (demo_creator / demo_user).
# REGLA: los datos precargados existen SOLO contra H2 (tests / local). Contra
# Postgres el seeder no se crea (H2DatasourceCondition), asÃ­ que un despliegue
# nunca siembra cuentas demo en la base real.
# La contraseÃ±a NO se commitea: va por variable de entorno. Si viene vacÃ­a el
# seeder aborta (no crea usuarios con contraseÃ±a vacÃ­a).
# Entorno: DEMO_PASSWORD (default: Clave1234!), APP_DEMO_ENABLED (default: true)
# Uso: DataSeeder
# ============================================================================
app.demo.password=${DEMO_PASSWORD:Clave1234!}
app.demo.enabled=${APP_DEMO_ENABLED:true}
