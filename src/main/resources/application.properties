spring.application.name=share

# H2 file-based (compatible con futura migración a Postgres; sin CLOB)
spring.datasource.url=jdbc:h2:file:./data/share
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Constantes de negocio (Global Constraints del plan)
escrow.commission-rate=0.05
escrow.auto-release-days=2
partial-refund-rate=0.5
