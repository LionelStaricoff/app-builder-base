<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Crear experiencia')}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
<main class="app-main">
    <div class="card" style="padding:1.25rem">
        <h2 th:text="${experienceId} != null ? 'Editar experiencia' : 'Nueva experiencia'">Experiencia</h2>
        <div class="error" th:if="${error}" th:text="${error}">Error</div>

        <form th:action="${experienceId} != null ? @{/experiences/{id}(id=${experienceId})} : @{/experiences}"
              th:object="${experienceForm}" method="post" enctype="multipart/form-data">
            <label>Nombre
                <input type="text" th:field="*{name}" required>
            </label>
            <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Error</span>

            <label>Descripción
                <textarea th:field="*{description}" rows="4" required></textarea>
            </label>
            <span class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Error</span>

            <label>Imágenes (1 a 5, la primera es la tapa)
                <input type="file" name="images" accept="image/*" multiple>
            </label>

            <label>Duración (minutos)
                <input type="number" th:field="*{durationMinutes}" min="1" required>
            </label>
            <span class="error" th:if="${#fields.hasErrors('durationMinutes')}" th:errors="*{durationMinutes}">Error</span>

            <label>Cupo mínimo
                <input type="number" th:field="*{minCapacity}" min="1" required>
            </label>
            <label>Cupo máximo
                <input type="number" th:field="*{maxCapacity}" min="1" required>
            </label>
            <span class="error" th:if="${#fields.hasErrors('maxCapacity')}" th:errors="*{maxCapacity}">Error</span>

            <label>Precio por persona (MXN)
                <input type="number" step="0.01" th:field="*{price}" min="0" required>
            </label>

            <label>Categoría
                <select th:field="*{category}" required>
                    <option value="">Elegí una</option>
                    <option th:each="c : ${T(com.openlab.mx.share.experience.entity.ExperienceCategory).values()}"
                            th:value="${c}" th:text="${c}">Categoria</option>
                </select>
            </label>
            <span class="error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}">Error</span>

            <fieldset>
                <legend>Recurrencia</legend>
                <label><input type="radio" th:field="*{recurrenceType}" value="UNIQUE"> Única ocasión</label>
                <label><input type="radio" th:field="*{recurrenceType}" value="WEEKLY"> Recurrente (semanal)</label>
            </fieldset>

            <div id="unique-fields">
                <label>Fecha
                    <input type="date" name="schedules[0].date"
                           th:value="${experienceForm.schedules != null ? (!#lists.isEmpty(experienceForm.schedules) ? experienceForm.schedules[0].date : '') : ''}">
                </label>
                <label>Hora inicio
                    <input type="time" name="schedules[0].startTime" value="10:00">
                </label>
                <label>Hora fin
                    <input type="time" name="schedules[0].endTime" value="12:00">
                </label>
            </div>

            <div id="weekly-fields" hidden>
                <div id="weekly-rows">
                    <div class="weekly-row">
                        <select name="schedules[0].dayOfWeek">
                            <option th:each="d : ${T(java.time.DayOfWeek).values()}" th:value="${d}"
                                    th:text="${d}">Lunes</option>
                        </select>
                        <input type="time" name="schedules[0].startTime" value="18:00">
                        <input type="time" name="schedules[0].endTime" value="20:00">
                        <input type="date" name="schedules[0].rangeStart">
                        <input type="date" name="schedules[0].rangeEnd">
                    </div>
                </div>
                <button type="button" id="add-weekly-row" class="btn-secondary">+ Agregar día</button>
            </div>

            <fieldset>
                <legend>Punto de encuentro (tocá el mapa)</legend>
                <div id="form-map" data-map="pick" style="height:260px;border-radius:16px"></div>
                <input type="hidden" th:field="*{meetingLat}" id="meetingLat">
                <input type="hidden" th:field="*{meetingLng}" id="meetingLng">
                <p class="hint">Se centra en tu ubicación automáticamente; mové el marcador para ajustar.</p>
            </fieldset>

            <button type="submit" class="btn-primary" th:text="${experienceId} != null ? 'Guardar cambios' : 'Crear experiencia'">Guardar</button>
        </form>
    </div>
</main>
<nav th:replace="~{fragments/layout :: nav('mine')}"></nav>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script th:src="@{/js/map.js}"></script>
<script th:src="@{/js/experience-form.js}"></script>
</body>
</html>
