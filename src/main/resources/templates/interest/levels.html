<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('¿Cuánto sabés?')}"></head>
<body class="interest-body">

<main class="interest-page">

    <header class="interest-head">
        <div class="interest-head-top">
            <a th:href="@{/onboarding/intereses(next=${next})}" class="interest-skip">Volver</a>
        </div>

        <p class="interest-step">Paso 2 de 2</p>
        <div class="interest-progress" role="progressbar" aria-label="Paso 2 de 2"
             aria-valuemin="1" aria-valuemax="2" aria-valuenow="2">
            <span class="interest-progress-bar is-done"></span>
            <span class="interest-progress-bar is-done"></span>
        </div>

        <h1 class="interest-title">¿Cuánto sabés de cada tema?</h1>
        <p class="interest-lead">Es solo para calibrar: te mostramos planes a tu altura, ni muy básicos ni muy avanzados.</p>
    </header>

    <form class="interest-form" method="post" th:action="@{/onboarding/intereses/niveles}">
        <input type="hidden" name="_csrf" th:value="${_csrf.token}">
        <input type="hidden" name="next" th:value="${next}">
        <input type="hidden" name="subrubroIds" th:each="s : ${elegidos}" th:value="${s.id}">

        <fieldset class="interest-level" th:each="s : ${elegidos}">
            <legend class="interest-level-name">
                <span th:text="${s.nombre}">Subrubro</span>
                <span class="interest-level-rubro" th:if="${rubroLabels[s.categoria] != null}"
                      th:text="${rubroLabels[s.categoria]}">Rubro</span>
            </legend>

            <div class="interest-seg">
                <label class="interest-seg-opt" th:each="nivel : ${nivelesDisponibles}">
                    <input type="radio" th:name="'levels[' + ${s.id} + ']'"
                           th:value="${nivel.name()}" th:checked="${niveles[s.id] == nivel}">
                    <span th:text="${nivel.label}">Nivel</span>
                </label>
            </div>
        </fieldset>

        <footer class="interest-foot">
            <button type="submit" class="btn-primary interest-cta">Listo, a explorar</button>
        </footer>
    </form>
</main>

</body>
</html>
