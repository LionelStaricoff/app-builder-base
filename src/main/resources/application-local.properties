# ============================================================================
# Perfil local: H2 en memoria, sin Postgres, sin Didit y sin proveedor de IA.
#
# Uso: .\scripts\dev.ps1 spring-boot:run -Dspring-boot.run.profiles=local
#
# No toca application.properties ni el .env. Las migraciones Flyway corren
# igual que en Postgres y Hibernate solo valida (ddl-auto=validate), así que
# este perfil detecta el mismo drift de esquema que producción.
# ============================================================================
spring.datasource.url=jdbc:h2:mem:movo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# Sin proveedor de IA: el generador de propuestas cae en el stub determinista.
spring.ai.model.chat=none
ai.proposal.provider=stub

# Sin KYC real en local: el gate de identidad queda apagado a propósito.
identity.verification.enabled=false
# Ignorar las credenciales de Didit del .env: en local no se llama a la red.
# Para probar el flujo real con el túnel de ngrok, comentar estas dos líneas.
didit.api-key=
didit.workflow-id=
didit.callback-url=http://localhost:8080/verificacion/callback

# El DataSeeder solo se activa con H2 (H2DatasourceCondition), así que en este
# perfil se siembran demo_user / demo_creator con app.demo.password.
app.demo.enabled=true
