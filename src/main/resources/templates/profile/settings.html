<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Configuración')}"></head>
<body>
<main class="app-main">
    <div class="empty" th:if="${ok}" th:text="${ok}">OK</div>
    <div class="empty" th:if="${error}" th:text="${error}">Error</div>

    <section class="visual-selector card" style="padding:1rem">
        <h3>Estilo Visual</h3>
        <div class="visual-selector-options">
            <button type="button" class="btn-secondary" data-visual-style="1">🌸 Claro</button>
            <button type="button" class="btn-secondary" data-visual-style="2">💜 Violeta</button>
            <button type="button" class="btn-secondary" data-visual-style="3">🌙 Oscuro</button>
        </div>
    </section>

    <div class="card" style="padding:1rem">
        <img th:if="${user.avatarBase64 != null}" alt="Avatar"
             th:src="'data:image/jpeg;base64,' + ${user.avatarBase64}"
             class="avatar-ring">
        <p><strong th:text="${user.username}">usuario</strong></p>
        <p class="meta"><strong th:text="${user.spPoints} + ' SP'">0 SP</strong></p>
    </div>

    <form th:action="@{/settings/update}" method="post" enctype="multipart/form-data"
          class="card" style="padding:1rem;display:flex;flex-direction:column;gap:.8rem">
        <input type="hidden" name="_csrf" th:value="${_csrf.token}">
        <label>Nombre
            <input name="username" th:value="${user.username}" required class="form-input">
        </label>
        <div class="form-grid">
            <label>País
                <select name="country" id="settings-country" class="form-input">
                    <option th:each="c : ${ {'México','Argentina','Colombia','Chile','Perú','Uruguay','España','Estados Unidos','Brasil'} }"
                            th:value="${c}" th:text="${c}"
                            th:selected="${user.country == c}">País</option>
                </select>
            </label>
            <label>Moneda
                <select name="currencyCode" id="settings-currency" class="form-input">
                    <option th:each="m : ${ {'MXN','ARS','COP','CLP','PEN','UYU','EUR','USD','BRL'} }"
                            th:value="${m}" th:text="${m}"
                            th:selected="${user.currencyCode == m}">MXN</option>
                </select>
            </label>
        </div>
        <p class="hint">Los precios del feed se muestran en esta moneda.</p>
        <label>Avatar (máx 5 MB)</label>
        <div class="image-picker image-picker--avatar" id="avatar-picker" data-max-files="1" data-max-bytes="5242880">
            <input type="file" id="avatar-input" name="avatar" accept="image/*" hidden>
            <div class="image-picker-drop" id="avatar-picker-drop" role="button" tabindex="0"
                 aria-label="Elegir avatar">
                <span class="image-picker-icon">👤</span>
                <span class="image-picker-title">Tocá para elegir tu avatar</span>
                <span class="hint">JPG, PNG o WebP · hasta 5 MB · 1 foto</span>
            </div>
            <div class="image-picker-previews" id="avatar-picker-previews"></div>
            <p class="error" id="avatar-picker-error" hidden></p>
        </div>
        <button type="submit" class="btn-primary">Guardar</button>
    </form>

    <form th:action="@{/settings/logout}" method="post" style="margin-top:1rem">
        <input type="hidden" name="_csrf" th:value="${_csrf.token}">
        <button type="submit" class="btn-secondary">Cerrar sesión</button>
    </form>
</main>
<nav th:replace="~{fragments/layout :: nav('settings')}"></nav>
<script>
    (function () {
        var map = { 'México': 'MXN', 'Argentina': 'ARS', 'Colombia': 'COP', 'Chile': 'CLP', 'Perú': 'PEN', 'Uruguay': 'UYU', 'España': 'EUR', 'Estados Unidos': 'USD', 'Brasil': 'BRL' };
        var country = document.getElementById('settings-country');
        var currency = document.getElementById('settings-currency');
        if (!country || !currency) return;
        country.addEventListener('change', function () {
            var sugerida = map[country.value];
            if (sugerida) currency.value = sugerida;
        });
    })();

    // Marca el botón activo al entrar y delega clicks (Theme global vive en layout).
    document.addEventListener('DOMContentLoaded', function() {
        var apply = window.Theme ? window.Theme.set : window.setStyle;
        if (!apply) return;
        var saved = null;
        try { saved = localStorage.getItem('visualStyle'); } catch (e) { /* storage no disponible */ }
        apply(saved || 1);
    });
    document.querySelector('.visual-selector-options').addEventListener('click', function (ev) {
        var btn = ev.target.closest('[data-visual-style]');
        if (!btn) return;
        var apply = window.Theme ? window.Theme.set : window.setStyle;
        if (!apply) return;
        apply(btn.getAttribute('data-visual-style'));
    });

</script>
<script th:src="@{/js/image-picker.js}"></script>
</body>
</html>
