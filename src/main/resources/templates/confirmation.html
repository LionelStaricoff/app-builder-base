<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Confirmación')}"></head>
<body>
<main class="app-main">
    <div class="card section">
        <div th:if="${reservation == null}">
            <h1 class="page-title">Todavía no tenés reservas</h1>
            <a class="btn-primary" th:href="@{/feed}">Ver experiencias</a>
        </div>
        <div th:if="${reservation != null}">
            <!--/* El monto es el título real de esta pantalla: es lo primero que
                 el usuario quiere confirmar. */-->
            <p class="pay-amount"
               th:text="${(esCreador ? 'COBRASTE ' : 'PAGASTE ') + currencyCode + ' ' + #numbers.formatDecimal(monto, 1, 'COMMA', 2, 'POINT')}">PAGASTE MXN 0.00</p>
            <p th:text="${reservation.instance.experience.name}">Experiencia</p>
            <p class="meta" th:text="${'Para ' + reservation.attendees + (reservation.attendees == 1 ? ' cupo' : ' cupos') + ' · llega a tu cuenta ' + currencyCode + ' ' + #numbers.formatDecimal(payout, 1, 'COMMA', 2, 'POINT') + ' menos 5% de comisión'}">Detalle</p>

            <!--/* Salidas post-pago: calendario */-->

            <div class="confirmation-actions">
                <a class="btn-secondary" th:href="@{/reservations/{id}/calendar.ics(id=${reservation.id})}">
                    <svg class="icon-inline" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                    Añadir a mi calendario
                </a>
                <a class="btn-primary" th:href="@{/reservations}">Mis reservas</a>
            </div>
        </div>
    </div>
</main>
<nav th:replace="~{fragments/layout :: nav('feed')}"></nav>
</body>
</html>
