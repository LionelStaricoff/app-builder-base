<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Chat')}"></head>
<body>
<main class="app-main">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <p class="meta">
        <a th:href="@{/chats}">← Mis chats</a>
        · <strong th:text="${instance.experience.name}">Experiencia</strong>
        · <span th:text="${T(com.openlab.mx.movo.shared.ui.UiLabels).fechaCorta(instance.date)}">24 oct</span>
    </p>

    <div class="empty" th:if="${archivado}">Esta fecha fue cancelada: el chat está en solo-lectura.</div>

    <div id="chat-messages" class="card section">
        <p class="chat-msg" th:each="m : ${mensajes}">
            <strong th:text="${m.user.username}">usuario</strong>:
            <span th:text="${m.text}">hola</span>
            <span class="hint" th:text="${#temporals.format(m.createdAt, 'HH:mm')}">10:00</span>
        </p>
        <p id="chat-empty" class="empty" th:if="${#lists.isEmpty(mensajes)}">Todavía no hay mensajes.</p>
    </div>

    <form id="chat-form" th:if="${!archivado}"
          th:action="@{/chats/{id}/send(id=${instanceId})}" method="post"
          class="chat-form">
        <input id="chat-text" name="text" placeholder="Escribí un mensaje…" required
               aria-label="Mensaje" class="form-input">
        <button type="submit" class="btn-primary">Enviar</button>
    </form>
</main>
<nav th:replace="~{fragments/layout :: nav('chats')}"></nav>
<script th:inline="javascript">
    window.CHAT_INSTANCE_ID = /*[[${instanceId}]]*/ 0;
</script>
<script th:src="@{/vendor/sockjs/sockjs.min.js}"></script>
<script th:src="@{/vendor/stomp/stomp.min.js}"></script>
<script th:src="@{/js/chat.js}"></script>
</body>
</html>
